Global:
  version: "2.0"
  group_email: wuchufan@baidu.com

Default:
  profile: [publish]

Profiles:
  - profile:
    name: dev
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      tools:
        - python: 3.12.0
    build:
      command: pip3 install -r requirements.txt && python3 -m build

  - profile:
    name: publish
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      tools:
        - python: 3.12.0
    build:
      command: pip3 install -r requirements.txt && python3 -m build

  - profile:
    name: dev_compile
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      tools:
        - python: 3.12.0
    build:
      command: CI_STAGE=compile bash ipipe_build.sh
    artifacts:
      release: true