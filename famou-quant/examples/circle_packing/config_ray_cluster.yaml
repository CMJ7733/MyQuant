# Circle Packing Experiment Configuration
# Target: Maximize sum of radii for n=26 circles in unit square
# AlphaEvolve benchmark result: 2.635

# =============================================================================
# Experiment Configuration - WHAT to optimize
# =============================================================================
experiment:
  name: circle_packing_evolution
  task_description: |
    # Circle Packing Optimization Problem

    ## Goal
    Construct an arrangement of **N=26** circles within a unit square $[0, 1] \times [0, 1]$ such that the **sum of their radii** is maximized.

    ## Problem Definition
    You need to implement a Python function `construct_packing` that generates the positions and radii for 26 circles.

    ### Constraints
    1.  **Containment:** All circles must be entirely contained within the unit square. For a circle $i$ with center $(x_i, y_i)$ and radius $r_i$:
        $$0 \le x_i - r_i$$
        $$x_i + r_i \le 1$$
        $$0 \le y_i - r_i$$
        $$y_i + r_i \le 1$$

    2.  **Non-overlapping:** No two circles can overlap. For any pair of distinct circles $i$ and $j$:
        $$\sqrt{(x_i - x_j)^2 + (y_i - y_j)^2} \ge r_i + r_j$$

    ### Objective
    Maximize the objective function:
    $$ \text{Score} = \sum_{i=0}^{25} r_i $$

    **Target Score:** The known best benchmark (from AlphaEvolve) is approximately **2.635**.


    ## Implementation Interface
    Your code must define the following function signature:

    ```python
    import numpy as np

    def construct_packing():
        """
        Construct a specific arrangement of 26 circles in a unit square.

        Returns:
            centers (np.ndarray): Shape (26, 2) array of (x, y) coordinates.
            radii (np.ndarray): Shape (26,) array of radii.
            sum_radii (float): The sum of all radii.
        """
        # ... implementation ...
        return centers, radii, sum_radii
    ```

  language: python
  strategy: standard  # Strategy name: standard, exploration, etc.

  # Execution scope
  max_iterations: 10
  max_workers: 1
  checkpoint_interval: 5
  seed: 42

    # Island model (multi-population evolution)
  island:
    num_islands: 2
    island_size: 10
    migration_interval: 5
    migration_size: 1
    migration_topology: ring
    reset_interval: 15
    reset_size: 1

# =============================================================================
# Infrastructure Configuration - HOW to run
# =============================================================================
infrastructure:
  # LLM Configuration
  llm:
    provider: openai
    api_base: my_api_base
    model: my_model
    api_key: my_api_key  # Replace with your API key or use environment variable
    temperature: 0.7
    max_tokens: 16000
    timeout: 3600

  # Storage Configuration
  storage:
    type: local
    base_path: ./famou_data

  # Logger Configuration
  logger:
    type: local
    level: INFO
    file_enabled: true

  # Execution Environment
  env:
    type: local
    timeout: 30
    cpu: 1
    # gpu: 1
  
  # Monitoring Configuration (Optional)
  monitor:
    enabled: false  # Set to false to disable monitoring
    type: wandb  # Monitoring backend type (currently only 'wandb' is supported)

    # WandB-specific settings
    wandb:
      project: famou-circle-packing  # WandB project name
      entity: null  # WandB entity (username or team), null for default
      run_name: null  # Run name, null for auto-generation
      group: null  # Group name for grouping related runs
      tags:
        - circle_packing
        - creative_exploration
      notes: "Circle packing optimization with creative exploration strategy"

      # Async logging settings
      async_mode: true  # Enable asynchronous (non-blocking) logging
      num_workers: 2  # Number of async worker threads
      queue_size: 100  # Max queue size for async logging

      # What to monitor
      track_metrics:
        islands: true  # Track metrics for each island
        performance: true  # Track performance metrics (best, avg, median scores)
        population: true  # Track population metrics (size, generations)
        diversity: true  # Track diversity metrics (genetic, code diversity)
        cost: true  # Track LLM API costs
      track_artifacts: true  # Track artifacts (best programs, visualizations)
      track_lineage_tree: true  # Track lineage tree visualization
      checkpoint_interval: 1  # Record metrics every N iterations

  # langfuse configuration (optional)
  langfuse:
    enabled: false  # Set to false to disable Langfuse integration
    public_key: your_public_key
    secret_key: your_secret_key
    base_url: https://us.cloud.langfuse.com
  
  backend:
    mode: ray
    ray_host: ray://10.94.147.104:8081

