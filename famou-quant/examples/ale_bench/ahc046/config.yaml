experiment:
  name: deepseek_v3.2_ahc046
  task_description: |
    You are a world-class algorithm engineer, and you are very good at programming. Now, you are participating in a programming contest. 
    You are asked to solve a heuristic problem, known as an NP-hard problem.
    The problem statement is given below. First, please analyze the problem statement. Please think about the essential points of the problem and possible algorithms to get a higher rank in the contest.
    Next, please implement your solution in C++17. You can use external libraries as follows gcc version 9.4.0, Boost version 1.71.0.0ubuntu2, GMP version 2:6.2.0+dfsg-4ubuntu0.1, Eig version 3.3.7-2.
    
    Problem Statement
    Execution time limit 2.0 sec and Memory limit 1073741824 MB 

    Story
    --------
    There is a skating rink consisting of $N \times N$ squares.
    Let $(0, 0)$ be the coordinates of the top-left square, and $(i, j)$ be the coordinates of the square located $i$ squares down and $j$ squares to the right from there.
    All squares outside the $N \times N$ area are covered with blocks and are impassable.
    Initially, there are no blocks inside the $N \times N$ area.

    You start at the initial position $(i_0, j_0)$ and must visit the specified target squares $(i_1, j_1), \dots, (i_{M-1}, j_{M-1})$ in the given order.

    At each turn, you may choose one of the four cardinal directions and perform one of the following actions:

    - **Move**: Move one square in the specified direction. You cannot move into a square containing a block.
    - **Slide**: Continue sliding in the specified direction until you hit a block.
    - **Alter**: Place a block on the adjacent square in the specified direction if it does not already contain one; otherwise, remove the existing block.
      You may not specify a square outside the $N \times N$ area.
      It is also allowed to place a block on a current or future target square; however, you must remove the block in order to visit that square.

    If you slide over a target square without stopping on it, it is **not** considered visited.
    A target square is considered visited only if you either stop on it after a **Slide**, or move onto it directly via a **Move**.

    You must visit the target squares in the given order.
    Even if you pass over a later target square before visiting earlier ones, it is not considered visited at that time. You will need to visit it again when its turn in the sequence arrives.

    You may perform at most $2NM$ actions.
    Visit all target squares in the specified order using as few turns as possible.

    Scoring
    --------
    Let $T$ be the length of the output action sequence, and $m$ be the number of target squares successfully visited.
    Then, you will obtain the following score.

    - If $m<M-1$, $m+1$
    - If $m=M-1$, $M+2NM-T$

    There are $150$ test cases, and the score of a submission is the total score for each test case.
    If your submission produces an illegal output or exceeds the time limit for some test cases, the submission itself will be judged as <span class='label label-warning' data-toggle='tooltip' data-placement='top' title="Wrong Answer">WA</span> or <span class='label label-warning' data-toggle='tooltip' data-placement='top' title="Time Limit Exceeded">TLE</span> , and the score of the submission will be zero.
    The highest score obtained during the contest will determine the final ranking, and there will be no system test after the contest.
    If more than one participant gets the same score, they will be ranked in the same place regardless of the submission time.


    Input
    --------
    Input is given from Standard Input in the following format:

    ~~~
    $N$ $M$
    $i_0$ $j_0$
    $\vdots$
    $i_{M-1}$ $j_{M-1}$
    ~~~

    - In all test cases, $N = 20$ and $M = 40$ are fixed.
    - The coordinates $(i_k, j_k)$ of the initial position and each target square are integers satisfying $0 \leq i_k, j_k \leq N-1$, and all coordinates are distinct.


    Output
    --------
    At each turn, represent the selected action and direction using a single uppercase alphabet letter as follows.

    **Actions**

    - Move: `M`
    - Slide: `S`
    - Alter: `A`

    **Directions**

    - Up: `U`
    - Down: `D`
    - Left: `L`
    - Right: `R`

    Let $a_t$ and $d_t$ denote the action and direction selected at turn $t$ ($t = 0, 1, \dots, T-1$), respectively.  
    Then, output to Standard Output in the following format:
    ~~~
    $a_0$ $d_0$
    $\vdots$
    $a_{T-1}$ $d_{T-1}$
    ~~~


    <a href="https://img.atcoder.jp/ahc046/EuNd3uow.html?lang=en&seed=0&output=sample">Show example</a>
    
    Metric definition
    score_list: the score of the solution on each individual test cases
    score: the overall score on all test cases
    combined_score: the aggregated score that you need to improve
    
    Goal
    maximize the score of your solution so that you can improve your combined_score. 


    Here, We provide some improvement guidance which may help improve your algorithm.
    Speedup Tips:
    Based on the code and feedback: What are the key algorithms and data structures used? What are its computational complexity bottlenecks (consider feedback
    like Time Limit Exceeded)? How might we improve the time or space complexity (consider feedback like Memory Limit Exceeded)? Consider both small
    optimizations and completely different approaches. You don't need to implement the solution yet. Instead, please think deeply and broadly about
    the possible improvements, and explain your thoughts.
    Simulated Annealing State Improvement Tips:
    If this solution uses simulated annealing, analyze the problem, solution properties, and feedback to suggest better state representation. Consider how
    the current state encoding might be limiting the search space or convergence speed, especially in light of the feedback. Think about alternative state
    encodings that could lead to better local optima or faster convergence. You don't need to implement the solution yet. Instead, please think deeply and
    broadly about the possible improvements, and explain your thoughts.
    Simulated Annealing Neighbor Improvement Tips:
    If this solution uses simulated annealing, analyze the problem, solution properties, and feedback to suggest better neighborhood design. Consider how
    the current neighborhood structure might be limiting the search space  exploration or convergence speed, based on the feedback. Think about
    alternative neighborhood structures that could lead to better local optima or faster convergence. Specifically, consider:
    1. How to balance between small and large moves in the search space
    2. How to ensure the neighborhood structure allows reaching any valid solution
    3. How to design moves that maintain solution feasibility while exploring new regions
    You don't need to implement the solution yet. Instead, please think deeply and broadly about the possible improvements, and explain your thoughts.
    Beam Search Improvement Tips:
    Consider implementing or improving a beam search approach. Think about the beam width and evaluation function that could lead to better solutions. Consider
    how to effectively balance between diversity and quality in your beam. You don't need to implement the solution yet. Instead, please think deeply and
    broadly about the possible improvements, and explain your thoughts.

    Focus on breaking through the plateau by trying fundamentally different approaches or combining different approches - don't just tweak parameters.

  language: cpp
  strategy: adaptive_cluster  # Strategy name: standard, exploration, etc.

  # Execution scope
  max_iterations: 100
  max_workers: 4
  checkpoint_interval: 10
  seed: 42

  # Experience system
  experience_retrieval:
    enabled: true
    retrieval_mode: combined
    similarity_threshold: 0.7
    rrf_k: 60
    l1_trigger: interval
    l1_interval: 10

  # Debug loop (auto-injected by Evolver into code-producing rollouts)
  debug:
    enabled: true
    max_iterations: 3

    # Island model (multi-population evolution)
  island:
    num_islands: 1
    island_size: 60
    migration_interval: 1000000
    migration_size: 5
    migration_topology: ring
    reset_interval: 1000000
    reset_size: 1

# =============================================================================
# Infrastructure Configuration - HOW to run
# =============================================================================
