experiment:
  name: mlebench-new-york-city-taxi-fare-prediction
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
    **Imporatance Note**: When designing your solution, you should also take into account the timeframe in which the competition was held. Some competitions took place over ten years ago, when many of today's powerful models did not yet exist and deep learning itself was still in its early stages. In fact, you could even outperform others by combining straightforward machine learning approaches with well-chosen implementation tricks.
    **When utilizing machine learning frameworks like XGBoost (xgb), and CatBoost, training should be performed on GPU rather than CPU.(Where possible, avoid using LightGBM, as its training time is excessively long and often unacceptable.)** 

    # Core Task Info
    {
      "Task Type": "Regression",
      "Data Type": "Tabular",
      "Brief Description": "This competition challenges participants to predict the fare amount for a taxi ride in New York City. Given pickup and dropoff locations, along with other features like pickup time and passenger count, the goal is to build a machine learning model that outperforms a baseline model based solely on distance, aiming for a lower Root Mean-Squared Error (RMSE).",
      "Dataset Description": "The dataset is provided in three main CSV files. The original `train.csv` has been processed and is now presented as `labels.csv`.\n- `labels.csv`: This file serves as the training set, containing approximately 55 million rows. It includes features such as `key` (a unique identifier), `pickup_datetime`, `pickup_longitude`, `pickup_latitude`, `dropoff_longitude`, `dropoff_latitude`, and `passenger_count`, along with the target variable `fare_amount`.\n- `test.csv`: This is the test set, containing about 10,000 rows with the same features as the training set but without the `fare_amount` column. The task is to predict the fare for each row in this file.\n- `sample_submission.csv`: This file provides an example of the required submission format, with two columns: `key` and the predicted `fare_amount`.",
      "Submission Specifications": "The submission file must be a CSV file containing a header and two columns: `key` and `fare_amount`. For each `key` from the test set, you must provide a predicted `fare_amount`. The format should be as follows:\n```\nkey,fare_amount\n2015-01-27 13:08:24.0000002,11.00\n2015-02-27 13:08:24.0000002,12.05\n...\n```",
      "Submission channel number to each sample": 1,
      "Metric Evaluation Description": "The evaluation metric for this competition is the Root Mean-Squared Error (RMSE). RMSE quantifies the difference between the predicted fare amounts and the actual fare amounts (ground truth). It is calculated as the square root of the average of the squared differences between predictions and actual values. A smaller RMSE indicates a better model performance, as it signifies a smaller average error. The formula is given by: RMSE = sqrt( (1/n) * sum( (y_hat_i - y_i)^2 ) ), where 'y_hat_i' is the prediction for the i-th observation and 'y_i' is the actual value.",
      "Metric Name": "RMSE",
      "Metric Direction": false,
      "Longer time limit required": "True"
    }

