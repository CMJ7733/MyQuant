    # Other Requirements
     - Code Generation Requirements:
        - Library Imports: All libraries must be imported at the beginning of the file. Implicit imports are prohibited.
        - Feature Processing: Handle missing values and features conservatively. For uncertain feature types, first determine the type before selecting imputation and processing strategies.
        - Computing resource: Provides sufficient CPU computing power and 1 A800 graphics cards, you can use them freely if necessary.
        - CPU resources are relatively sufficient, so it is appropriate to run more workers during data processing and loading.
        - Maximize GPU utilization and estimate a suitable batch size based on the number of model parameters.
        - Try to use the latest models, which often bring better results. For example, efficient_net is often better than restnet, and the larger size of efficient_net, such as large, is also better than base.
        - If you train a deep learning model, do not train for more than 10 epochs at the beginning. You can adjust it according to the results of the code execution. If it is underfitting, you can increase the epochs.
        - For a deep learning task, predictions need to be made after each epoch of training and the corresponding submission_epoch.csv file needs to be generated. The storage path should remain consistent. For example, for a task that trains for 3 epochs, the first round of training predictions is saved as `submission_1.csv`, the second round of training predictions is saved as `submission_2.csv`, and so on...
        - You need to save the trained model to the specified save address above. The model should be saved in the format of the `transformers` library. Furthermore, ensure that each epoch's model is saved in a folder following the naming convention `model_name_epoch`.
        - If you intend to use certain models, you should use the name from Hugging Face rather than a local directory.
        - Prioritize the `transformers` library over `timm` for all model loading operations.
        - When a pre-trained model download from a remote repository like Hugging Face fails, attempt to use a different model rather than retrying the same one.
        - **Do not use exception handling mechanisms in any data loading steps; expose potential issues instead, and never fabricate submission files.**
        
     - Code Style:
        - Clear variable naming
        - Optional type annotations
        - Brief comments for key steps
        - Print information about key steps instead of using tqdm to print the training process
        - All variables and standard library functions must be defined before use
        - Directly generate a complete, end-to-end CSV output
        - Provide executable code that runs without errors and produces the **submission.csv** file as required
        Suppress all warnings to avoid displaying warning messages
    
    ## Ultimate Goal
      - Maximize your score in this task/competition and rank higher on the leaderboard. Apply a combination of techniques (machine learning knowledge and Kaggle competition tricks) to achieve this.
    
    ## Scheme Limitations
      - Your proposed solutions must account for time constraints. The running time of any plan should not exceed 6 hours; otherwise, it will be difficult to complete execution smoothly.
    
    ## File Paths
     - Submission file Save path: /mnt/cfs_bj_mt/workspace/gezengle/fm/agent/workspace/baidu/acgbenchmark/alpha_evolve/ventilator-pressure-prediction/submission.csv
     - Model Save path: /mnt/cfs_bj_mt/workspace/gezengle/fm/agent/workspace/baidu/acgbenchmark/alpha_evolve/ventilator-pressure-prediction/model_save
     - Read path: /mnt/cfs_bj_mt/workspace/caolizhe/public/mlebench-competitions/ventilator-pressure-prediction/prepared/public/
    
  language: python
  strategy: example_strategy  # Strategy name: standard, exploration, etc.

  # Execution scope
  max_iterations: 50
  max_workers: 1
  checkpoint_interval: 1
  seed: 42

  experience_retrieval:
    enabled: true
    retrieval_mode: combined
    similarity_threshold: 0.7
    rrf_k: 60

    # Island model (multi-population evolution)
  island:
    num_islands: 1
    island_size: 100
    migration_interval: 5
    migration_size: 1
    migration_topology: ring
    reset_interval: 15
    reset_size: 1

# =============================================================================
# Infrastructure Configuration - HOW to run
# =============================================================================
infrastructure:
  # LLM Configuration
  llm:
    provider: openai
    api_base: http://211.23.3.237:27544/v1
    model: gemini-3-pro-preview
    api_key: YOUR_API_KEY  # Replace with your API key or use environment variable
    temperature: 0.7
    max_tokens: 64000
    timeout: 3600

  # Storage Configuration
  storage:
    type: local
    base_path: ./famou_data

  # Logger Configuration
  logger:
    type: local
    level: INFO
    file_enabled: true

  # Execution Environment
  env:
    type: local
    timeout: 14400
    # GPU Usage (Optional)
    gpu_ids: [4]      # Available GPU IDs (empty list = no GPU)
    gpu_num_each_run: 1.0      # Number of GPUs per evaluation task
    input_params:
      competition_name: ventilator-pressure-prediction
  
  # Monitoring Configuration (Optional)
  monitor:
    enabled: false  # Set to false to disable monitoring
    type: wandb  # Monitoring backend type (currently only 'wandb' is supported)

    # WandB-specific settings
    wandb:
      project: famou-mlebench  # WandB project name
      entity: null  # WandB entity (username or team), null for default
      run_name: null  # Run name, null for auto-generation
      group: null  # Group name for grouping related runs
      tags:
        - mlebench
        - creative_exploration
      notes: "Circle packing optimization with creative exploration strategy"

      # Async logging settings
      async_mode: true  # Enable asynchronous (non-blocking) logging
      num_workers: 4  # Number of async worker threads
      queue_size: 100  # Max queue size for async logging

      # What to monitor
      track_metrics:
        islands: true  # Track metrics for each island
        performance: true  # Track performance metrics (best, avg, median scores)
        population: true  # Track population metrics (size, generations)
        diversity: true  # Track diversity metrics (genetic, code diversity)
        cost: true  # Track LLM API costs
      track_artifacts: true  # Track artifacts (best programs, visualizations)
      track_lineage_tree: true  # Track lineage tree visualization
      checkpoint_interval: 1  # Record metrics every N iterations

  # langfuse configuration (optional)
  # langfuse:
  #   enabled: false  # Set to false to disable Langfuse integration
  #   public_key: your_public_key
  #   secret_key: your_secret_key
  #   base_url: https://us.cloud.langfuse.com



# =============================================================================
# Module Parameters (optional) - ALGORITHM parameters
# =============================================================================
modules:
  generate:
    # Production canary for new generation protocol:
    # - hybrid: XML-first + fenced/json fallback (recommended)
    # - xml: strict XML-first
    # - legacy_json: one-click rollback
    output_protocol: hybrid
