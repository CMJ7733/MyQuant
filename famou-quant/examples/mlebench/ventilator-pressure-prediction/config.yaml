# Circle Packing Experiment Configuration
# Target: Maximize sum of radii for n=26 circles in unit square
# AlphaEvolve benchmark result: 2.635

# =============================================================================
# Experiment Configuration - WHAT to optimize
# =============================================================================
experiment:
  name: mlebench-ventilator-pressure-prediction
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
    **Imporatance Note**: When designing your solution, you should also take into account the timeframe in which the competition was held. Some competitions took place over ten years ago, when many of today's powerful models did not yet exist and deep learning itself was still in its early stages. In fact, you could even outperform others by combining straightforward machine learning approaches with well-chosen implementation tricks.

    # Core Task Info
    {
      "Task Type": "Regression",
      "Data Type": "Time Series",
      "Brief Description": "This competition challenges participants to simulate a ventilator connected to a sedated patient's lung. The goal is to predict the airway pressure in the respiratory circuit based on a time series of control inputs and lung attributes. The aim is to leverage machine learning, particularly neural networks, to create models that can generalize across different lung characteristics, ultimately helping to reduce the cost and improve the development of mechanical ventilation control algorithms.",
      "Dataset Description": "The dataset consists of time series data simulating breaths from a mechanical ventilator connected to an artificial lung. Each row represents a single time step within a breath. The data is split into three main files:\n\n- `train.csv`: The training set, containing 5,432,400 time steps. It includes the features and the target variable. The columns are `id` (time step identifier), `breath_id` (breath identifier), `R` (airway restriction), `C` (lung compliance), `time_step`, `u_in` (inspiratory valve control), `u_out` (expiratory valve control), and `pressure` (the target airway pressure).\n\n- `test.csv`: The test set, containing 603,600 time steps. It has the same structure and columns as `train.csv` but omits the `pressure` column, which needs to be predicted.\n\n- `sample_submission.csv`: A file demonstrating the required submission format, with columns `id` and `pressure`.",
      "Submission Specifications": "For each `id` in the test set, you must predict a single continuous value for the `pressure` variable. The submission file must be a CSV file containing a header and two columns: `id` and `pressure`.",
      "Submission channel number to each sample": 1,
      "Metric Evaluation Description": "Submissions are evaluated using the mean absolute error (MAE) between the predicted and actual airway pressures. The scoring is calculated only on the time steps corresponding to the inspiratory phase of each breath; the expiratory phase is excluded from the evaluation. The score is the mean of the absolute differences between all predicted pressures and their corresponding actual values in the scored portion of the test set.",
      "Metric Name": "Mean Absolute Error",
      "Metric Direction": false,
      "Longer time limit required": "True"
    }

