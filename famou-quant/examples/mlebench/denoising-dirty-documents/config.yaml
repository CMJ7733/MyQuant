# Circle Packing Experiment Configuration
# Target: Maximize sum of radii for n=26 circles in unit square
# AlphaEvolve benchmark result: 2.635

# =============================================================================
# Experiment Configuration - WHAT to optimize
# =============================================================================
experiment:
  name: mlebench-denoising-dirty-documents
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
     - You should prioritize using pre-trained models that are at the forefront of the field, as this usually leads to better results.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).

    # Core Task Info
    {
      "Task Type": "Regression",
      "Data Type": "Image (Computer Vision)",
      "Brief Description": "This competition challenges participants to perform image denoising on scanned documents. Given a dataset of images with synthetic noise (simulating real-world artifacts like coffee stains, wrinkles, etc.), the goal is to create a model that removes the noise and restores the clean version of the text, thereby improving the potential for Optical Character Recognition (OCR).",
      "Dataset Description": "The dataset consists of three main folders of PNG images and a sample submission file. The `train/` folder contains 115 images of text with synthetic noise. The `train_cleaned/` folder contains the corresponding 115 clean, ground-truth versions of the training images. The `test/` folder contains 29 noisy images for which participants must generate cleaned versions. The task is to train a model on the paired noisy and clean images from the training set to predict the cleaned versions of the images in the test set. A `sampleSubmission.csv` file is also provided as a template for submissions.",
      "Submission Specifications": "Submissions must be in a CSV file format with two columns: `id` and `value`. The file must include a header. Each row corresponds to a single pixel in a test image. The `id` column should be a string formatted as `image_row_col` (e.g., '110_1_1' represents the pixel at row 1, column 1 of image '110'). The `value` column should be the predicted grayscale intensity for that pixel, a floating-point number ranging from 0 (black) to 1 (white).",
      "Submission channel number to each sample": 1,
      "Metric Evaluation Description": "Submissions are evaluated using the Root Mean Squared Error (RMSE). The RMSE is calculated between the predicted pixel intensity values in the submission file and the actual grayscale pixel intensity values of the ground-truth clean images. The error is computed for each pixel, squared, averaged over all pixels in all test images, and then the square root of this average is taken. A lower RMSE score indicates a better performance.",
      "Metric Name": "Root Mean Squared Error",
      "Metric Direction": false,
      "Longer time limit required": "True"
    }

