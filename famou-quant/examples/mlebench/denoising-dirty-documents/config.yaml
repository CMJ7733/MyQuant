     - Save path (submission file): /mnt/cfs_bj_mt/workspace/gezengle/fm/agent/workspace/baidu/acgbenchmark/alpha_evolve/denoising-dirty-documents/submission.csv
     - Model Save path: /mnt/cfs_bj_mt/workspace/gezengle/fm/agent/workspace/baidu/acgbenchmark/alpha_evolve/denoising-dirty-documents/model_save
     - Read path: /mnt/cfs_bj_mt/workspace/caolizhe/public/mlebench-competitions/denoising-dirty-documents/prepared/public/

    
  language: python
  strategy: example_strategy  # Strategy name: standard, exploration, etc.

  # Execution scope
  max_iterations: 2
  max_workers: 1
  checkpoint_interval: 1
  seed: 42

  # Experience system
  experience_retrieval:
    enabled: true
    retrieval_mode: combined
    similarity_threshold: 0.7
    rrf_k: 60
    l1_trigger: interval
    l1_interval: 6
    # l0_path: ./famou_data/circle_packing_evolution_20260318_172949_926d/

  # Knowledge system (MethodCard)
  knowledge:
    enabled: false
    source_dir: knowledge

    # Island model (multi-population evolution)
  island:
    num_islands: 1
    island_size: 100
    migration_interval: 5
    migration_size: 1
    migration_topology: ring
    reset_interval: 15
    reset_size: 1

# =============================================================================
# Infrastructure Configuration - HOW to run
# =============================================================================
infrastructure:
  # LLM Configuration
  llm:
    provider: openai
    api_base: http://211.23.3.237:27544/v1
    model: gemini-3-pro-preview
    api_key: YOUR_API_KEY  # Replace with your API key or use environment variable
    temperature: 0.7
    max_tokens: 64000
    timeout: 3600

  # Storage Configuration
  storage:
    type: local
    base_path: ./famou_data

  # Logger Configuration
  logger:
    type: local
    level: INFO
    file_enabled: true

  # Execution Environment
  env:
    type: local
    timeout: 14400
    # GPU Usage (Optional)
    gpu_ids: [0, 1, 2, 3]      # Available GPU IDs (empty list = no GPU)
    gpu_num_each_run: 1.0      # Number of GPUs per evaluation task
    input_params:
      competition_name: denoising-dirty-documents
  
  # Monitoring Configuration (Optional)
  monitor:
    enabled: false  # Set to false to disable monitoring
    type: wandb  # Monitoring backend type (currently only 'wandb' is supported)

    # WandB-specific settings
    wandb:
      project: famou-mlebench  # WandB project name
      entity: null  # WandB entity (username or team), null for default
      run_name: null  # Run name, null for auto-generation
      group: null  # Group name for grouping related runs
      tags:
        - mlebench
        - creative_exploration
      notes: "Circle packing optimization with creative exploration strategy"

      # Async logging settings
      async_mode: true  # Enable asynchronous (non-blocking) logging
      num_workers: 4  # Number of async worker threads
      queue_size: 100  # Max queue size for async logging

      # What to monitor
      track_metrics:
        islands: true  # Track metrics for each island
        performance: true  # Track performance metrics (best, avg, median scores)
        population: true  # Track population metrics (size, generations)
        diversity: true  # Track diversity metrics (genetic, code diversity)
        cost: true  # Track LLM API costs
      track_artifacts: true  # Track artifacts (best programs, visualizations)
      track_lineage_tree: true  # Track lineage tree visualization
      checkpoint_interval: 1  # Record metrics every N iterations

  # langfuse configuration (optional)
  # langfuse:
  #   enabled: false  # Set to false to disable Langfuse integration
  #   public_key: your_public_key
  #   secret_key: your_secret_key
  #   base_url: https://us.cloud.langfuse.com



# =============================================================================
# Module Parameters (optional) - ALGORITHM parameters
# =============================================================================
modules:
  generate:
    # Production canary for new generation protocol:
    # - hybrid: XML-first + fenced/json fallback (recommended)
    # - xml: strict XML-first
    # - legacy_json: one-click rollback
    output_protocol: hybrid
