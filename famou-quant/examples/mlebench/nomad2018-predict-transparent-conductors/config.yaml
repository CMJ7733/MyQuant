experiment:
  name: mlebench-nomad2018-predict-transparent-conductors
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
     - You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
     - **When utilizing machine learning frameworks like LightGBM (lgb), XGBoost (xgb), and CatBoost, training should be performed on GPU rather than CPU.** 
     - **lgb设置参数时，请务必使用GPU,CPU训练时间太长，无法接受,如果无法使用GPU训练lgb，那就不要使用lgb这个模型，换其他的方法，这是必须要遵守的规则.**
      ```
      'device': 'cuda', 
      'gpu_device_id': 0
      ```
    **When utilizing machine learning frameworks like LightGBM (lgb), XGBoost (xgb), and CatBoost, training should be performed on GPU rather than CPU.** 

    # Core Task Info
    {
        "Task Type": "Regression",
        "Data Type": "Tabular",
        "Brief Description": "This competition challenges participants to predict two key properties of transparent conductors—formation energy and bandgap energy—based on their atomic structures. The goal is to develop machine learning models that can accelerate the discovery of new materials with improved properties for technologies like solar cells and flat-panel displays, bypassing computationally expensive quantum-mechanical calculations.",
        "Dataset Description": "The dataset consists of tabular data and spatial geometry files for 3,000 materials. The primary data is contained in two CSV files:\n\n- `train.csv`: Contains 2160 samples with 12 feature columns and 2 target columns. The features include material properties like `spacegroup`, `number_of_total_atoms`, relative atomic compositions (`percent_atom_al`, `percent_atom_ga`, `percent_atom_in`), and lattice parameters (vectors and angles). The two target variables to be predicted are `formation_energy_ev_natom` and `bandgap_energy_ev`.\n- `test.csv`: Contains 240 samples with the same 12 feature columns as the training set, for which predictions are required.\n\nAdditionally, for each material ID in the train and test sets, there is a corresponding `geometry.xyz` file located in the `train/{id}/` and `test/{id}/` directories. These files provide the spatial positions (Cartesian coordinates) of all atoms within the material's unit cell, offering detailed structural information.",
        "Submission Specifications": "For each `id` in the test set, you must predict a value for both `formation_energy_ev_natom` and `bandgap_energy_ev`. The submission file must be a CSV with a header and three columns: `id`, `formation_energy_ev_natom`, and `bandgap_energy_ev`. An example format is provided in `sample_submission.csv`.",
        "Submission channel number to each sample": 2,
        "Metric Evaluation Description": "Submissions are evaluated on the column-wise root mean squared logarithmic error (RMSLE). The RMSLE is calculated independently for each of the two target columns (`formation_energy_ev_natom` and `bandgap_energy_ev`). The final score is the mean of the RMSLE values from these two columns. The formula for RMSLE for a single column is: \n\n$\\sqrt{\\frac{1}{n}\\sum_{i=1}^n(\\log{(p_i + 1)} - \\log{(a_i+1)})^2}$\n\nwhere:\n- n is the total number of observations\n- p_i is your prediction\n- a_i is the actual value\n- log(x) is the natural logarithm of x",
        "Metric Name": "Mean Column-wise Root Mean Squared Logarithmic Error",
        "Metric Direction": false,
        "Longer time limit required": "True"
    }

