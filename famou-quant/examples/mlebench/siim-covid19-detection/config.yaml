# Circle Packing Experiment Configuration
# Target: Maximize sum of radii for n=26 circles in unit square
# AlphaEvolve benchmark result: 2.635

# =============================================================================
# Experiment Configuration - WHAT to optimize
# =============================================================================
experiment:
  name: mlebench-siim-covid19-detection
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
    **Imporatance Note**: When designing your solution, you should also take into account the timeframe in which the competition was held. Some competitions took place over ten years ago, when many of today's powerful models did not yet exist and deep learning itself was still in its early stages. In fact, you could even outperform others by combining straightforward machine learning approaches with well-chosen implementation tricks. 

    # Core Task Info
    {
        "Task Type": "Classification",
        "Data Type": "Image (Computer Vision)",
        "Brief Description": "This competition challenges participants to develop a computer vision model to identify and localize COVID-19 abnormalities on chest radiographs. The task is twofold: at the image level, detect and draw bounding boxes around lung opacities, and at the study level, classify the radiograph as 'negative for pneumonia', 'typical', 'indeterminate', or 'atypical' for COVID-19.",
        "Dataset Description": "The dataset is designed for a dual object detection and classification task on chest radiographs. It is structured into `train` and `test` directories, each containing subdirectories for individual studies and series, which in turn hold the chest scan images in DICOM (`.dcm`) format.\n\nKey files in the dataset include:\n- `train/` and `test/`: These folders contain the DICOM image files, organized by study and series IDs.\n- `train_study_level.csv`: Provides study-level labels. It has an `id` column for each study and four binary columns indicating the classification: `Negative for Pneumonia`, `Typical Appearance`, `Indeterminate Appearance`, and `Atypical Appearance`.\n- `train_image_level.csv`: Contains image-level annotations. It includes an `id` for each image, a `StudyInstanceUID`, a `label` string with class and bounding box information (e.g., 'opacity 1 x_min y_min x_max y_max'), and a `boxes` column with bounding box coordinates in a dictionary format.\n- `train_meta.csv` and `test_meta.csv`: These files provide metadata for the images, including `image_id`, `series_id`, and image dimensions (`dim0`, `dim1`).\n- `sample_submission.csv`: A sample file demonstrating the required submission format for both study-level and image-level predictions.",
        "Submission Specifications": "The submission must be a CSV file named `submission.csv` with two columns: `Id` and `PredictionString`.\n- The `Id` column must contain unique identifiers for each study and image in the test set, formatted as `{id}_study` or `{id}_image`.\n- The `PredictionString` column contains the predictions. \n  - For study-level predictions, the format is `class_name confidence 0 0 1 1`. Multiple labels can be provided for a single study, separated by spaces (e.g., `indeterminate 1 0 0 1 1 atypical 1 0 0 1 1`). The classes are `negative`, `typical`, `indeterminate`, `atypical`.\n  - For image-level predictions, the format is `class_name confidence xmin ymin xmax ymax`. The class is `opacity`. Multiple bounding boxes can be predicted for a single image. If no opacities are found, the prediction should be `none 1 0 0 1 1`.",
        "Submission channel number to each sample": 4,
        "Metric Evaluation Description": "Submissions are evaluated using the mean Average Precision (mAP) at an Intersection over Union (IoU) threshold of 0.5, based on the PASCAL VOC 2010 methodology. The evaluation considers predictions at both the study and image levels. \n- For image-level 'opacity' predictions, the mAP is calculated by comparing the predicted bounding boxes against the ground truth boxes. \n- For study-level classifications ('negative', 'typical', 'indeterminate', 'atypical'), predictions are submitted with a dummy bounding box (`0 0 1 1`), and they are treated as distinct classes in the overall mAP calculation. \n- The final score is the mean of the Average Precision (AP) calculated for each class across all images and studies.",
        "Metric Name": "mean Average Precision (mAP)",
        "Metric Direction": true,
        "Longer time limit required": "True"
    }

