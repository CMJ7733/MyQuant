experiment:
  name: mlebench-siim-isic-melanoma-classification
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
    **Imporatance Note**: When designing your solution, you should also take into account the timeframe in which the competition was held. Some competitions took place over ten years ago, when many of today's powerful models did not yet exist and deep learning itself was still in its early stages. In fact, you could even outperform others by combining straightforward machine learning approaches with well-chosen implementation tricks.
    **When utilizing machine learning frameworks like LightGBM (lgb), XGBoost (xgb), and CatBoost, training should be performed on GPU rather than CPU.** 

    # Core Task Info
    {
        "Task Type": "Classification",
        "Data Type": "Image (Computer Vision), Tabular",
        "Brief Description": "This competition challenges participants to identify melanoma in dermoscopic images of skin lesions. The goal is to develop a model that can predict the probability of a lesion being malignant. A unique aspect of the competition is the encouragement to use patient-level contextual information (multiple images from the same patient) to improve diagnostic accuracy, mimicking the clinical workflow of dermatologists.",
        "Dataset Description": "The dataset combines image data with corresponding metadata. The metadata is provided in two CSV files: `train.csv` (28,984 entries) and `test.csv` (4,142 entries). These files contain information such as `image_name`, `patient_id`, `sex`, `age_approx`, and `anatom_site_general_challenge`. The `train.csv` file also includes the ground truth `target` column, where 1 indicates a malignant lesion and 0 indicates a benign one. The image data is provided in three different formats located in corresponding folders: `jpeg/` (JPEG format), `train/` and `test/` (original DICOM format), and `tfrecords/` (TFRecord format with images resized to 1024x1024). The file structure is as follows:\n- `train.csv`: Training set metadata with target labels.\n- `test.csv`: Test set metadata without target labels.\n- `jpeg/train/`: 28,984 training images in JPEG format.\n- `jpeg/test/`: 4,142 test images in JPEG format.\n- `train/`: 28,984 training images in DICOM format.\n- `test/`: 4,142 test images in DICOM format.\n- `tfrecords/`: Training and test images pre-processed into TFRecord files.",
        "Submission Specifications": "For each `image_name` in the test set, you must predict a single probability (`target`) that the lesion is malignant. The submission file must be a CSV file with a header and two columns: `image_name` and `target`. The format is as follows:\n```\nimage_name,target\nISIC_0052060,0.7\nISIC_0052349,0.9\nISIC_0058510,0.8\nISIC_0073313,0.5\nISIC_0073502,0.5\netc.\n```",
        "Submission channel number to each sample": 1,
        "Metric Evaluation Description": "Submissions are evaluated on the Area Under the Receiver Operating Characteristic Curve (AUC-ROC). This metric measures the ability of the classifier to distinguish between the two classes (malignant and benign) across all possible classification thresholds. The curve is created by plotting the true positive rate against the false positive rate at various threshold settings. The area under this curve represents the model's performance, where a value of 1.0 indicates a perfect classifier and 0.5 indicates a model with no discriminative ability.",
        "Metric Name": "Area Under the ROC Curve (AUC)",
        "Metric Direction": true,
        "Longer time limit required": "True"
    }

