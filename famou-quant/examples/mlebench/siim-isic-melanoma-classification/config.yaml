    # Other Requirements
     - Code Generation Requirements:
        - Library Imports: All libraries must be imported at the beginning of the file. Implicit imports are prohibited.
        - Feature Processing: Handle missing values and features conservatively. For uncertain feature types, first determine the type before selecting imputation and processing strategies.
        - Computing resource: Provides sufficient CPU computing power and 1 A800 graphics cards, you can use them freely if necessary.
        - CPU resources are relatively sufficient, so it is appropriate to run more workers during data processing and loading.
        - Maximize GPU utilization and estimate a suitable batch size based on the number of model parameters.
        - Try to use the latest models, which often bring better results. For example, efficient_net is often better than restnet, and the larger size of efficient_net, such as large, is also better than base.
        - If you train a deep learning model, do not train for more than 10 epochs at the beginning. You can adjust it according to the results of the code execution. If it is underfitting, you can increase the epochs.
        - For a deep learning task, predictions need to be made after each epoch of training and the corresponding submission_epoch.csv file needs to be generated. The storage path should remain consistent. For example, for a task that trains for 3 epochs, the first round of training predictions is saved as `submission_1.csv`, the second round of training predictions is saved as `submission_2.csv`, and so on...
        - You need to save the trained model to the specified save address above. The model should be saved in the format of the `transformers` library. Furthermore, ensure that each epoch's model is saved in a folder following the naming convention `model_name_epoch`.
        - If you intend to use certain models, you should use the name from Hugging Face rather than a local directory.
        - Prioritize the `transformers` library over `timm` for all model loading operations.
        - When a pre-trained model download from a remote repository like Hugging Face fails, attempt to use a different model rather than retrying the same one.
        - **Do not use exception handling mechanisms in any data loading steps; expose potential issues instead, and never fabricate submission files.**
        
     - Code Style:
        - Clear variable naming
        - Optional type annotations
        - Brief comments for key steps
        - Print information about key steps instead of using tqdm to print the training process
        - All variables and standard library functions must be defined before use
        - Directly generate a complete, end-to-end CSV output
        - Provide executable code that runs without errors and produces the **submission.csv** file as required
        Suppress all warnings to avoid displaying warning messages
    
    ## Ultimate Goal
     - Maximize your score in this task/competition and rank higher on the leaderboard. Apply a combination of techniques (machine learning knowledge and Kaggle competition tricks) to achieve this.
    
