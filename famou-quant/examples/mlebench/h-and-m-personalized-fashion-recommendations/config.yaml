experiment:
  name: mlebench-h-and-m-personalized-fashion-recommendations
  task_description: |
    You are an experienced machine learning algorithm engineer with expertise in end-to-end system optimization, feature engineering, robust neural network design, and efficient model development using PyTorch.
    Your current task is to design a machine learning/deep learning algorithm based on the requirements above. You have full freedom to redesign, enhance, or replace any of the following components:
     - Data loading and preprocessing (including augmentation, normalization, etc.)
     - Feature engineering or preprocessing (including selection, transformation, and normalization)
     - Choose suitable state-of-the-art models tailored to the task characteristics.
     - Integration of ML/DL algorithms (XGBoost, Random Forest, etc.)
     - Neural network architecture (custom layers, activation functions, attention mechanisms, normalization, regularization, etc.)
     - Training objectives (custom loss functions, auxiliary tasks, or multi-task learning)
     - Regularization strategies (dropout, weight decay, label smoothing, etc.)
     - Hyperparameter optimization (learning rate, schedulers, batch size, model depth/width, etc.)
     - Cross-validation for hyperparameter tuning (searching for optimal hyperparameters on the training set via cross-validation, then training the final model on the validation set)
     - Efficient training/inference pipelines (batching, data loading, distributed training, etc.)
     - Numerical stability and reproducibility (any known techniques to improve performance or efficiency in this domain)
     - ML tricks, Kaggle techniques, feature selection, feature engineering, model ensembling, etc.
    You may combine multiple steps, design new functional pipelines, restructure model architectures, or adopt any standard or innovative ML methods (as long as implemented in Python).
    **Imporatance Note**: When designing your solution, you should also take into account the timeframe in which the competition was held. Some competitions took place over ten years ago, when many of today's powerful models did not yet exist and deep learning itself was still in its early stages. In fact, you could even outperform others by combining straightforward machine learning approaches with well-chosen implementation tricks.
    **When utilizing machine learning frameworks like XGBoost (xgb), and CatBoost, training should be performed on GPU rather than CPU.(Where possible, avoid using LightGBM, as its training time is excessively long and often unacceptable.)** 

    # Core Task Info
    {
      "Task Type": "Recommendation",
      "Data Type": "Tabular, Time Series, Text (Natural Language Processing), Image (Computer Vision)",
      "Brief Description": "In this competition, H&M Group invites participants to develop product recommendations based on data from previous transactions, as well as from customer and product metadata. The challenge is to predict which articles each customer will purchase in the 7-day period immediately after the training data ends, aiming to enhance the shopping experience and improve sustainability by reducing returns.",
      "Dataset Description": "The dataset consists of customer purchase history, metadata for customers and articles, and corresponding article images. The data is structured into several files:\n- `transactions_train.csv`: This 3.4 GB file contains the training data, detailing the purchases made by each customer for each date (`t_dat`), including `customer_id`, `article_id`, `price`, and `sales_channel_id`. It represents the historical transaction data.\n- `customers.csv`: This file provides metadata for each `customer_id`, including demographic information like `age`, `club_member_status`, and `postal_code`.\n- `articles.csv`: This file contains detailed metadata for each `article_id`, such as product name (`prod_name`), product type (`product_type_name`), a detailed text description (`detail_desc`), and color information.\n- `images/`: This folder contains images corresponding to each `article_id`. The images are organized into subfolders named after the first three digits of the `article_id` (e.g., images for `article_id` 0108775015 are in the `images/010/` subfolder).\n- `sample_submission.csv`: A file demonstrating the required submission format.",
      "Submission Specifications": "For each `customer_id`, you must predict up to 12 `article_id`s that the customer is predicted to buy in the 7-day period following the training data. The submission file must be a CSV with a header and two columns: `customer_id` and `prediction`. The `prediction` column should contain a single string of space-separated `article_id`s. It is advantageous to always provide 12 predictions per customer.\n\nExample format:\n```\ncustomer_id,prediction\n00000dba,0706016001 0706016002 0372860001 ...\n0000423b,0706016001 0706016002 0372860001 ...\n```",
      "Submission channel number to each sample": 12,
      "Metric Evaluation Description": "Submissions are evaluated using the Mean Average Precision @ 12 (MAP@12). The formula is:\n$$\\text{MAP@12}=\\frac{1}{U} \\sum_{u=1}^U \\frac{1}{\\min (m, 12)} \\sum_{k=1}^{\\min (n, 12)} P(k) \\times \\text{rel}(k)$$\nWhere:\n- `U` is the total number of customers in the test set.\n- `n` is the number of predictions made for a customer (up to 12).\n- `m` is the number of ground truth items (actual purchases) for a customer.\n- `P(k)` is the precision at cutoff `k` (the proportion of correct predictions among the top `k` predictions).\n- `rel(k)` is an indicator function that is 1 if the item at rank `k` is a correct prediction and 0 otherwise.\n\nKey points:\n- Customers who did not make any purchases during the test period are excluded from scoring.\n- There is no penalty for providing 12 predictions even if a customer purchased fewer than 12 items; thus, making 12 predictions for each customer is recommended.",
      "Metric Name": "Mean Average Precision @ 12 (MAP@12)",
      "Metric Direction": true,
      "Longer time limit required": "True"
    }

