<!DOCTYPE html>
<!--
  CogAlpha monitor — single file, no build step, no CDN.

  Everything is hand-rolled: SVG for the charts, CSS grid for the layout, one SSE
  connection for the data. No npm, no bundler, no external requests. This machine
  cannot reach github, and a dashboard that needs a network to render is useless for
  watching a run on a remote box through an SSH tunnel.

  Data flow: /api/stream pushes a full snapshot once a second; render() is a pure
  function of that snapshot. Detail panels fetch on click, because prompts are large
  and nobody is reading 100k of them.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CogAlpha 智能因子研究监控</title>
<style>
  :root {
    --md-primary:#0b57d0; --md-on-primary:#ffffff; --md-primary-container:#d3e3fd; --md-on-primary-container:#041e49;
    --md-background:#f8fafd; --md-surface:#ffffff; --md-surface-variant:#eef3f8; --md-outline:#c7cdd5; --md-outline-variant:#e1e5eb;
    --md-text:#202124; --md-text-secondary:#5f6368; --md-success:#137333; --md-success-container:#e6f4ea;
    --md-warning:#7c5800; --md-warning-container:#fef7e0; --md-error:#b3261e; --md-error-container:#f9dedc;
    --market-up:#d93025; --market-down:#188038; --radius-card:16px; --radius-control:12px;
    --shadow:0 1px 2px rgba(60,64,67,.15),0 2px 6px rgba(60,64,67,.08);
    --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--md-background); }
  body {
    margin:0; background:var(--md-background); color:var(--md-text);
    font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; }
  a { color:var(--md-primary); }
  code, .mono { font-family:var(--mono); }
  .num, .metric-value, td.num, th.num, #updated-at { font-variant-numeric:tabular-nums; }
  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .app-bar {
    position:sticky; top:0; z-index:20; min-height:72px; padding:12px 24px;
    display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.94);
    border-bottom:1px solid var(--md-outline-variant); backdrop-filter:blur(12px);
  }
  .product-mark {
    flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center;
    border-radius:12px; color:var(--md-on-primary); background:var(--md-primary);
    font-size:20px; font-weight:700; box-shadow:var(--shadow);
  }
  .brand-block { min-width:180px; }
  .brand { color:var(--md-text); font-size:17px; font-weight:650; letter-spacing:.1px; }
  .product-subtitle { color:var(--md-text-secondary); font-size:12px; }
  .run-meta { display:flex; min-width:0; align-items:center; gap:10px; flex:1; }
  #runname {
    max-width:260px; overflow:hidden; color:var(--md-on-primary-container);
    background:var(--md-primary-container); text-overflow:ellipsis; white-space:nowrap;
  }
  #cfg { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .status-chip, .meta-chip {
    display:inline-flex; align-items:center; min-height:32px; gap:7px; padding:5px 11px;
    border:1px solid var(--md-outline-variant); border-radius:999px; font-size:12px;
    font-weight:600; white-space:nowrap;
  }
  .status-chip.live { color:var(--md-on-primary); background:var(--md-primary); border-color:var(--md-primary); }
  .status-chip.done { color:var(--md-success); background:var(--md-success-container); border-color:transparent; }
  .status-chip.stale { color:var(--md-warning); background:var(--md-warning-container); border-color:transparent; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .status-chip.live .dot { background:var(--md-on-primary); }
  .live .dot { animation:pulse 1.1s steps(2,end) infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  #updated-at { color:var(--md-text-secondary); font-size:11px; white-space:nowrap; }

  main { width:min(1600px,100%); margin:0 auto; padding:24px; }
  .warning-stack { display:grid; gap:8px; margin-bottom:16px; }
  .card {
    background:var(--md-surface); border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-card); box-shadow:var(--shadow); overflow:hidden;
  }
  .hero-card { margin-bottom:18px; }
  .section-heading { padding:20px 20px 0; }
  .section-heading h1, .section-heading h2 { margin:0; color:var(--md-text); font-weight:650; }
  .section-heading h1 { font-size:23px; }
  .section-heading h2 { font-size:17px; }
  .section-heading .note { display:block; margin-top:4px; color:var(--md-text-secondary); font-size:12px; }
  .metric-grid { display:grid; grid-template-columns:repeat(7,minmax(112px,1fr)); gap:12px; padding:18px 20px 20px; }
  .metric {
    min-width:0; padding:14px; border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-control); background:var(--md-background);
  }
  .metric-label { color:var(--md-text-secondary); font-size:11px; font-weight:600; }
  .metric-value { margin-top:5px; color:var(--md-text); font:600 21px/1.2 var(--mono); }
  .metric.emphasis { border-color:#a8c7fa; background:#edf3fe; }
  .metric.emphasis .metric-value { color:var(--md-primary); }
  .agent-section { margin-bottom:18px; }
  #matrix { padding:12px 20px 20px; }
  .level { display:grid; grid-template-columns:210px minmax(0,1fr); gap:16px; padding:12px 0; border-top:1px solid var(--md-outline-variant); }
  .level:first-child { border-top:0; }
  .level-tag {
    padding:8px 0; color:var(--md-text-secondary); font-size:12px; font-weight:650;
  }
  .level-agents { display:grid; grid-template-columns:repeat(3,minmax(170px,1fr)); gap:10px; }
  .agent-card {
    position:relative; min-height:100px; padding:13px; cursor:pointer; outline:none;
    border:1px solid var(--md-outline-variant); border-radius:var(--radius-control);
    background:var(--md-surface); transition:box-shadow .16s, border-color .16s, transform .16s;
  }
  .agent-card:hover { border-color:#a8c7fa; box-shadow:0 2px 8px rgba(60,64,67,.16); }
  .agent-card:focus-visible { border-color:var(--md-primary); box-shadow:0 0 0 3px rgba(11,87,208,.18); }
  .agent-card .agent-name { overflow:hidden; margin-right:58px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
  .agent-status { position:absolute; top:13px; right:13px; display:flex; align-items:center; gap:5px; color:var(--md-text-secondary); font-size:10px; }
  .agent-state-dot { width:7px; height:7px; border-radius:50%; background:var(--md-outline); }
  .agent-meta { margin-top:10px; color:var(--md-text-secondary); font:11px/1.4 var(--mono); font-variant-numeric:tabular-nums; }
  .agent-progress { position:absolute; right:13px; bottom:13px; left:13px; height:4px; overflow:hidden; border-radius:999px; background:var(--md-surface-variant); }
  .agent-progress span { display:block; height:100%; border-radius:inherit; background:var(--md-primary); }
  .agent-card.running { border-color:#a8c7fa; background:#f5f8ff; }
  .agent-card.running .agent-state-dot { background:var(--md-primary); animation:pulse 1.1s ease-in-out infinite; }
  .agent-card.done .agent-state-dot { background:var(--md-success); }
  .agent-card.queued .agent-state-dot { background:var(--md-outline); }
  .agent-card.unselected { border-style:dashed; background:var(--md-background); }
  .agent-card.unselected .agent-progress span { background:var(--md-outline); }
  .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .dashboard-grid > .card { min-width:0; }
  .dashboard-grid .card-content { padding:16px 20px 20px; }
  .candidate-card { margin-top:18px; }
  .funnel-row { display:flex; align-items:center; gap:8px; min-height:26px; font-size:11px; border-bottom:1px solid var(--md-outline-variant); }
  .funnel-row .lbl {
    flex:0 0 126px; color:var(--md-text-secondary); font-family:var(--mono);
    font-size:10px; text-align:right; padding-right:2px;
  }
  .funnel-bar {
    flex:1; height:10px; overflow:hidden; display:flex; border-radius:999px;
    background:var(--md-surface-variant);
  }
  .funnel-bar .keep { background:var(--md-primary); height:100%; }
  .funnel-bar .lost { background:#f9ab00; height:100%; opacity:.75; }
  .funnel-row .num {
    flex:0 0 88px; text-align:right; font-family:var(--mono); font-size:10px; color:var(--md-text);
  }
  .funnel-row.terminal { border-top:1px solid var(--md-outline); }
  .funnel-row.terminal .keep { background:var(--md-success); }
  .funnel-row.terminal .lbl { color:var(--md-success); font-weight:650; }
  .funnel-row.terminal.elite { border-top:0; }
  .funnel-row.terminal.elite .keep { background:var(--md-primary); }
  .funnel-row.terminal.elite .lbl { color:var(--md-primary); }

  .table-scroll { width:100%; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:9px 10px; white-space:nowrap; }
  thead th {
    color:var(--md-text-secondary); font-weight:650; font-size:10px;
    border-bottom:1px solid var(--md-outline); background:var(--md-surface-variant); font-family:var(--mono);
  }
  tbody tr { border-bottom:1px solid var(--md-outline-variant); }
  tbody tr:last-child { border-bottom:0; }
  td.num, th.num { text-align:right; font-family:var(--mono); }
  tr.click { cursor:pointer; }
  tr.click:hover { background:#f0f4f9; }
  tr.click:focus-visible { outline:2px solid var(--md-primary); outline-offset:-2px; }
  .pos { color:var(--market-up); }
  .neg { color:var(--market-down); }
  .zero { color:var(--md-text-secondary); }

  .bar { height:3px; background:var(--md-primary); border-radius:999px; margin-top:3px; }
  .warn-box {
    padding:10px 12px; color:var(--md-warning); background:var(--md-warning-container);
    border:1px solid #f6d78b; border-radius:var(--radius-control); font-size:12px;
  }
  .empty { color:var(--md-text-secondary); font-size:12px; padding:12px 2px; }
  .sub { font-size:11px; color:var(--md-text-secondary); }

  #scrim { position:fixed; inset:0; z-index:30; opacity:0; pointer-events:none; background:rgba(32,33,36,.32); transition:opacity .2s; }
  #scrim.open { opacity:1; pointer-events:auto; }
  #agent-panel, #drawer {
    position:fixed; top:0; right:0; z-index:40; width:clamp(620px,60vw,920px); height:100%;
    display:flex; flex-direction:column; background:var(--md-surface);
    border-left:1px solid var(--md-outline-variant); box-shadow:-8px 0 28px rgba(60,64,67,.18);
    transform:translateX(102%); transition:transform .22s ease-out;
  }
  #agent-panel.open, #drawer.open { transform:none; }
  #drawer { z-index:45; width:min(780px,96vw); }
  .panel-head, #drawer .head {
    display:flex; align-items:flex-start; gap:12px; padding:20px;
    border-bottom:1px solid var(--md-outline-variant); background:var(--md-surface);
  }
  .panel-heading { min-width:0; flex:1; }
  #agent-panel-level { color:var(--md-primary); font-size:11px; font-weight:650; }
  #agent-panel-title { margin:3px 0 0; font-size:21px; line-height:1.3; }
  #agent-panel-subtitle { margin-top:4px; color:var(--md-text-secondary); font-size:12px; }
  .icon-button, .x {
    width:40px; height:40px; margin-left:auto; display:grid; place-items:center; flex:0 0 40px;
    cursor:pointer; color:var(--md-text-secondary); background:transparent;
    border:0; border-radius:50%; font-size:22px; line-height:1;
  }
  .icon-button:hover, .x:hover { color:var(--md-primary); background:var(--md-surface-variant); }
  .icon-button:focus-visible, .x:focus-visible { outline:3px solid rgba(11,87,208,.2); }
  #agent-tabs { display:flex; gap:4px; padding:10px 16px 0; border-bottom:1px solid var(--md-outline-variant); }
  #agent-tabs button {
    min-height:42px; padding:0 14px; cursor:pointer; color:var(--md-text-secondary);
    background:transparent; border:0; border-bottom:3px solid transparent; font-size:13px; font-weight:600;
  }
  #agent-tabs button[aria-selected="true"] { color:var(--md-primary); border-bottom-color:var(--md-primary); }
  #agent-tabs button:focus-visible { outline:2px solid var(--md-primary); outline-offset:-3px; }
  #agent-panel-body, #drawer .body { padding:20px; overflow:auto; flex:1; }
  #agent-panel-body h2, #drawer .body h2 { margin:22px 0 10px; font-size:14px; }
  #agent-panel-body pre, #drawer pre {
    padding:12px; overflow:auto; color:var(--md-text); background:var(--md-surface-variant);
    border:1px solid var(--md-outline-variant); border-radius:var(--radius-control);
    font:11px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word;
  }
  .kv {
    display:grid; grid-template-columns:minmax(110px,auto) 1fr; gap:7px 18px;
    margin:0 0 18px; font-size:12px;
  }
  .kv dt { color:var(--md-text-secondary); }
  .kv dd { margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .chk {
    padding:7px 9px; border-bottom:1px solid var(--md-outline-variant); border-left:3px solid var(--md-outline); font-size:11px;
  }
  .chk.ok { border-left-color:var(--md-success); }
  .chk.no { border-left-color:var(--md-warning); background:var(--md-warning-container); }
  .chk .p { color:var(--md-success); font-weight:700; }
  .chk .f { color:var(--md-warning); font-weight:700; }
  .tier-elite { color:var(--md-primary); font-weight:650; }
  .tier-qualified { color:var(--md-success); }
  .tier-plain { color:var(--md-text-secondary); }
  .tier-invalid { color:var(--md-error); }
  .agent-head-summary { display:block; margin-bottom:8px; }
  .agent-head-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .agent-head-chips .meta-chip { min-height:26px; padding:3px 9px; font-size:10px; }
  .agent-responsibility { margin:0 0 12px; color:var(--md-text-secondary); }
  .agent-context {
    margin-bottom:12px; padding:10px 12px; color:var(--md-on-primary-container);
    background:var(--md-primary-container); border-radius:var(--radius-control); font-weight:650;
  }
  .agent-summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .agent-summary-card {
    min-width:0; padding:12px; border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-control); background:var(--md-background);
  }
  .agent-summary-card .metric-value { overflow:hidden; font-size:17px; text-overflow:ellipsis; }
  .agent-mini-trajectory {
    display:block; width:100%; height:150px; border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-control); background:var(--md-background);
  }
  .agent-research { display:grid; gap:8px; margin-top:16px; }
  .agent-research details {
    border:1px solid var(--md-outline-variant); border-radius:var(--radius-control);
    background:var(--md-surface);
  }
  .agent-research summary { padding:10px 12px; cursor:pointer; color:var(--md-primary); font-weight:650; }
  .agent-research pre { margin:0 10px 10px; }
  .agent-section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .agent-section-head span { color:var(--md-text-secondary); font-size:11px; }
  .agent-activity-list, .agent-generation-list { display:grid; gap:10px; }
  .agent-activity-row {
    padding:12px; border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-control); background:var(--md-surface);
  }
  .agent-generation-row {
    padding:12px; border:1px solid var(--md-outline-variant);
    border-radius:var(--radius-control); background:var(--md-surface);
  }
  .agent-activity-row.click, .agent-generation-row.click { cursor:pointer; }
  .agent-activity-row.click:hover, .agent-generation-row.click:hover { background:var(--md-background); border-color:#a8c7fa; }
  .agent-activity-row:focus-visible, .agent-generation-row:focus-visible { outline:2px solid var(--md-primary); outline-offset:2px; }
  .agent-activity-title, .agent-generation-title { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .agent-operation-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .agent-operation-tags span {
    max-width:100%; padding:2px 7px; overflow:hidden; color:var(--md-text-secondary);
    background:var(--md-surface-variant); border-radius:999px; font:10px var(--mono); text-overflow:ellipsis;
  }
  .agent-row-metrics { display:flex; flex-wrap:wrap; gap:4px 12px; margin:10px 0 0; }
  .agent-row-metrics dt { color:var(--md-text-secondary); font-size:10px; }
  .agent-row-metrics dd { margin:0 8px 0 0; font:11px var(--mono); }
  .agent-skeleton { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .agent-skeleton span {
    min-height:84px; border-radius:var(--radius-control);
    background:linear-gradient(100deg,var(--md-surface-variant) 20%,var(--md-background) 40%,var(--md-surface-variant) 60%);
    background-size:200% 100%; animation:agent-skeleton 1.3s ease-in-out infinite;
  }
  @keyframes agent-skeleton { to { background-position:-200% 0; } }
  .agent-error {
    margin-bottom:12px; padding:14px; color:var(--md-error); background:var(--md-error-container);
    border:1px solid var(--md-error); border-radius:var(--radius-control);
  }
  .agent-error p { margin:5px 0 10px; }
  .agent-error button {
    min-height:36px; padding:0 14px; cursor:pointer; color:var(--md-on-primary);
    background:var(--md-primary); border:0; border-radius:999px; font-weight:650;
  }
  .agent-empty {
    padding:20px; text-align:center; border:1px dashed var(--md-outline);
    border-radius:var(--radius-card); background:var(--md-background);
  }
  .agent-empty-title { font-size:15px; font-weight:650; }
  .agent-tab-empty { padding:12px 0; }

  @media (max-width:1180px) {
    .metric-grid { grid-template-columns:repeat(4,minmax(112px,1fr)); }
    .dashboard-grid { grid-template-columns:1fr; }
  }
  @media (max-width:760px) {
    .app-bar { position:static; align-items:flex-start; padding:12px 16px; flex-wrap:wrap; }
    .brand-block { min-width:0; flex:1; }
    .run-meta { order:3; width:100%; flex-basis:100%; flex-wrap:wrap; }
    #cfg { width:100%; white-space:normal; }
    #updated-at { margin-left:auto; }
    main { padding:16px; }
    .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); padding:14px 16px 16px; gap:8px; }
    .section-heading { padding:17px 16px 0; }
    .level { grid-template-columns:1fr; gap:4px; }
    .level-agents { grid-template-columns:1fr; }
    #matrix { padding:8px 16px 16px; }
    #agent-panel, #drawer { width:100vw; max-width:none; }
    .agent-summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .dashboard-grid .card-content { padding:14px 16px 16px; }
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { min-width:560px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body>

<header class="app-bar">
  <div class="product-mark" aria-hidden="true">C</div>
  <div class="brand-block">
    <div class="brand">CogAlpha</div>
    <div class="product-subtitle">智能因子研究监控</div>
  </div>
  <span id="status" class="status-chip stale"><span class="dot"></span>等待事件</span>
  <div class="run-meta">
    <span id="runname" class="meta-chip"></span>
    <span id="cfg" class="sub"></span>
  </div>
  <time id="updated-at" aria-live="polite">尚未更新</time>
</header>

<main>
  <div class="warning-stack" id="warnbox" style="display:none"></div>

  <section class="card hero-card" aria-labelledby="overview-heading">
    <div class="section-heading">
      <h1 id="overview-heading">运行总览</h1>
      <span class="note">研究进程与资源使用情况</span>
    </div>
    <div class="metric-grid" id="stats"></div>
  </section>

  <section class="card agent-section" aria-labelledby="agent-heading">
    <div class="section-heading">
      <h2 id="agent-heading">Agent 层级</h2>
      <span class="note" id="agentnote"></span>
    </div>
    <div id="matrix"></div>
  </section>

  <div class="dashboard-grid">
    <section class="card" aria-labelledby="funnel-heading">
      <div class="section-heading">
        <h2 id="funnel-heading">质量漏斗</h2>
        <span class="note" id="funnelnote"></span>
      </div>
      <div class="card-content" id="funnel"></div>
    </section>

    <section class="card" aria-labelledby="traj-heading">
      <div class="section-heading">
        <h2 id="traj-heading">Elite 趋势</h2>
        <span class="note">每代得分；虚线表示 Agent 切换</span>
      </div>
      <div class="card-content">
        <svg id="traj" viewBox="0 0 560 180" preserveAspectRatio="none" style="width:100%;height:180px" aria-label="Elite 得分趋势图"></svg>
        <div id="plateau" class="sub"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="roles-heading">
      <div class="section-heading">
        <h2 id="roles-heading">LLM 成本</h2>
        <span class="note">按角色聚合</span>
      </div>

<script>
"use strict";

// ---------------------------------------------------------------- small helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function finiteNumber(value) {
  if (value == null || value === "") return null;
  const normalized = Number(value);
  return Number.isFinite(normalized) ? normalized : null;
}

function finiteInt(value) {
  const normalized = finiteNumber(value);
  return normalized == null || !Number.isInteger(normalized) ? null : normalized;
}

const intText = (value, fallback = "&ndash;") => {
  const normalized = finiteInt(value);
  return normalized == null ? fallback : esc(normalized);
};
const num = (value, digits = 4) => {
  const normalized = finiteNumber(value);
  return normalized == null ? "&ndash;" : esc(normalized.toFixed(digits));
};
const sgn = (value, digits = 4) => {
  const normalized = finiteNumber(value);
  return normalized == null ? "&ndash;"
    : esc((normalized >= 0 ? "+" : "") + normalized.toFixed(digits));
};
const col = (value, digits = 4) => {
  const normalized = finiteNumber(value);
  if (normalized == null) return '<span class="zero">&ndash;</span>';
  const cls = normalized > 0 ? "pos" : normalized < 0 ? "neg" : "zero";
  return `<span class="${cls}">${sgn(normalized, digits)}</span>`;
};
const tierCls = (tier) => "tier-" +
  (["elite", "qualified", "plain", "invalid"].includes(tier) ? tier : "invalid");
const K = (value) => {
  const normalized = finiteNumber(value);
  if (normalized == null) return "&ndash;";
  return normalized >= 1e6 ? esc((normalized / 1e6).toFixed(1) + "M")
    : normalized >= 1e3 ? esc((normalized / 1e3).toFixed(1) + "k")
    : esc(normalized);
};
const dur = (value) => {
  const normalized = finiteNumber(value);
  if (normalized == null) return "&ndash;";
  const seconds = Math.round(normalized);
  if (seconds < 60) return esc(seconds + "s");
  const minutes = Math.floor(seconds / 60);
  return minutes < 60 ? esc(minutes + "m " + (seconds % 60) + "s")
    : esc(Math.floor(minutes / 60) + "h " + (minutes % 60) + "m");
};
const percent = (value) => {
  const normalized = finiteNumber(value);
  return normalized == null ? 0 : Math.max(0, Math.min(100, normalized));
};
const themeColor = (token, fallback) =>
  getComputedStyle(document.documentElement).getPropertyValue(token).trim() || fallback;

const LEVELS_ZH = {
  1: "I 市场结构与周期",
  2: "II 极端风险与脆弱性",
  3: "III 量价动力",
  4: "IV 价格与波动行为",
  5: "V 多尺度复杂性",
  6: "VI 稳定性与状态门控",
  7: "VII 几何形态与融合"
};

const AGENT_SUMMARIES_ZH = {
  AgentMarketCycle: "识别长期趋势、市场阶段和周期状态转换。",
  AgentVolatilityRegime: "识别波动率状态及其切换。",
  AgentTailRisk: "衡量左尾风险暴露和损失分布形态。",
  AgentCrashPredictor: "寻找市场崩跌前的压力累积信号。",
  AgentLiquidity: "刻画流动性条件与单位成交量价格冲击。",
  AgentOrderImbalance: "从 OHLCV 几何推断买卖压力失衡。",
  AgentPriceVolumeCoherence: "衡量价格走势与成交量行为是否一致。",
  AgentVolumeStructure: "研究交易参与度、集中度和吸收现象。",
  AgentDailyTrend: "分析方向持续性和多日动量强度。",
  AgentReversal: "识别短期过度反应及其均值回归。",
  AgentRangeVol: "研究振幅波动和收缩—扩张周期。",
  AgentLagResponse: "识别波动、成交量与收益之间的滞后反馈。",
  AgentVolAsymmetry: "比较上涨与下跌阶段的非对称波动。",
  AgentDrawdown: "刻画回撤深度、持续时间与恢复路径。",
  AgentFractal: "衡量多尺度粗糙度和长期记忆。",
  AgentRegimeGating: "构造随市场状态变化的自适应信号门控。",
  AgentStability: "评估收益与衍生信号的时间稳定性。",
  AgentBarShape: "将 K 线实体、影线和对称性编码为连续特征。",
  AgentCreative: "探索非线性变换、重参数化与软门控。",
  AgentComposite: "融合独立因子，强调协同与正交性。",
  AgentHerding: "识别群体行为、拥挤交易与同步运动。"
};

const AGENT_TABS = ["overview", "activity", "generations"];
const AGENT_REFRESH_MIN_MS = 2000;
let LAST = null;
let AGENT_VIEW = null;
let AGENT_REQUEST_VERSION = 0;
let AGENT_ABORT = null;
let DETAIL_TRIGGER = null;
let DETAIL_REQUEST_VERSION = 0;
let DETAIL_ABORT = null;
let AGENT_PANEL_SUPPRESSED = false;
let POLL_IN_FLIGHT = false;
let POLL_TIMER = null;
let POLLING = false;
const SSE_FIRST_MESSAGE_TIMEOUT_MS = 4000;
let ACTIVE_EVENT_SOURCE = null;
let SSE_HAS_MESSAGE = false;
let SSE_WATCHDOG = null;
let SSE_SOURCE_VERSION = 0;

function stateLabel(state) {
  return ({running:"运行中", done:"已完成", queued:"排队中", unselected:"未选中"})[state]
    || "排队中";
}

function agentProgress(agent) {
  if (!agent.selected) return 0;
  const planned = finiteInt(LAST && LAST.config && LAST.config.generations) || 0;
  if (agent.status === "done") return 100;
  if (!planned) return agent.status === "running" ? 8 : 0;
  return percent(((finiteInt(agent.generations) || 0) / planned) * 100);
}

function bindAgentCards() {
  $("matrix").querySelectorAll(".agent-card[data-agent]").forEach((el) => {
    const open = () => showAgent(el.dataset.agent, el);
    el.onclick = open;
    el.onkeydown = (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open();
      }
    };
  });
}

function bindActionContainer(root) {
  const actionFor = (target) => target && target.closest ? target.closest("[data-action]") : null;
  root.onclick = (event) => {
    const action = actionFor(event.target);
    if (action && root.contains(action)) activateArchiveAction(action);
  };
  root.onkeydown = (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const action = actionFor(event.target);
    if (!action || !root.contains(action)) return;
    event.preventDefault();
    activateArchiveAction(action);
  };
}

function actionIdentity(element) {
  if (!element) return null;
  const action = element.dataset.action || "";
  const key = action === "call" ? element.dataset.seq
    : action === "candidate" ? element.dataset.file
    : action === "generation" ? `${element.dataset.agent}\n${element.dataset.gen}`
    : action === "alpha" ? element.dataset.alpha
    : action === "retry-agent" ? element.dataset.agent : "";
  return action && key != null ? {action, key} : null;
}

function findAction(identity) {
  if (!identity) return null;
  const roots = [$("calls"), $("cands"), $("agent-panel-body"), $("dbody")];
  for (const root of roots) {
    for (const element of root.querySelectorAll("[data-action]")) {
      const candidate = actionIdentity(element);
      if (candidate && candidate.action === identity.action && candidate.key === identity.key) return element;
    }
  }
  return null;
}

function controlIdentity(element) {
  const action = actionIdentity(element);
  if (action) return {type:"action", action:action.action, key:action.key};
  const agent = element && element.dataset ? element.dataset.agent : null;
  return agent == null ? null : {type:"agent", key:String(agent)};
}

function captureContainerFocus(root) {
  const active = document.activeElement;
  return active && root.contains(active) ? controlIdentity(active) : null;
}

function restoreContainerFocus(root, identity) {
  if (!identity) return;
  for (const element of root.querySelectorAll("[data-action],[data-agent]")) {
    const candidate = controlIdentity(element);
    if (!candidate || candidate.type !== identity.type || candidate.key !== identity.key) continue;
    if (candidate.type === "action" && candidate.action !== identity.action) continue;
    element.focus();
    return;
  }
}

function activateArchiveAction(element) {
  const action = element.dataset.action;
  if (["call", "candidate", "generation", "alpha"].includes(action) &&
      !$('drawer').contains(element)) {
    DETAIL_TRIGGER = actionIdentity(element);
  }
  switch (action) {
    case "call": return showCall(element.dataset.seq);
    case "candidate": return showCandidate(element.dataset.file);
    case "generation": return showGeneration(element.dataset.agent, element.dataset.gen);
    case "alpha": return showAlpha(element.dataset.alpha);
    case "retry-agent": return loadAgentDetail(element.dataset.agent, {
      retryFocus:document.activeElement === element
    });
  }
}

// ------------------------------------------------------------------- rendering
function render(s) {
  LAST = s;

  // --- header ---------------------------------------------------------------
  const st = $("status");
  if (s.finished) {
    st.className = "status-chip done";
    st.innerHTML = '<span class="dot"></span>已完成';
  } else if (s.live) {
    st.className = "status-chip live";
    st.innerHTML = '<span class="dot"></span>运行中';
  } else {
    st.className = "status-chip stale";
    st.innerHTML = '<span class="dot"></span>等待事件';
  }

  $("runname").textContent = s.run_name || "";
  const c = s.config || {};
  $("cfg").innerHTML = [
    c.market ? "市场 " + c.market : null,
    c.provider ? "数据 " + c.provider : null,
    c.horizon ? "周期 " + c.horizon + " 天" : null,
    c.fit_split ? "训练 " + c.fit_split : null,
    c.llm_provider ? c.llm_provider + ":" + c.llm_model : null
  ].filter(Boolean).map(esc).join(" &middot; ");
  const eventSeconds = finiteNumber(s.last_event_at);
  const eventTime = eventSeconds == null ? new Date() : new Date(eventSeconds * 1000);
  const updated = Number.isNaN(eventTime.getTime()) ? new Date() : eventTime;
  $("updated-at").dateTime = updated.toISOString();
  $("updated-at").textContent = "更新 " + updated.toLocaleTimeString("zh-CN", {
    hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
  });

  const t = s.totals || {};
  const gp = finiteInt(s.generations_planned) || 0;
  $("stats").innerHTML = [
    ["Agent", `${intText(s.agents_done)}/${intText(s.agents_total, "?")}`, true],
    ["代次", gp ? `${intText(s.generations_seen)}/${intText(gp)}` : intText(s.generations_seen), true],
    ["LLM 调用", K(t.llm_calls)],
    ["Tokens", K(t.llm_tokens)],
    ["单次 Tokens", K(t.tokens_per_call)],
    ["运行耗时", dur(t.elapsed_seconds)],
    ["唯一结构", intText(t.unique_structures)],
  ].map(([k, v, hi]) =>
    `<div class="metric${hi ? " emphasis" : ""}"><div class="metric-label">${k}</div>` +
      `<div class="metric-value">${v}</div></div>`
  ).join("");

  // --- warnings -------------------------------------------------------------
  const wb = $("warnbox");
  const warnings = Array.isArray(s.warnings) ? s.warnings : [];
  if (warnings.length) {
    wb.style.display = "";
    wb.innerHTML = warnings.map((warning) => `<div class="warn-box">${esc(warning)}</div>`).join("");
  } else { wb.style.display = "none"; }

  renderMatrix(s);
  renderFunnel(s);
  renderTraj(s);
  renderRoles(s);
  renderCalls(s);
  renderCands(s);
  scheduleAgentRefresh();
}

function renderMatrix(s) {
  const focus = captureContainerFocus($("matrix"));
  const agents = Array.isArray(s.agents) ? s.agents : [];
  const sel = agents.filter((a) => a.selected).length;
  $("agentnote").innerHTML =
    `${intText(sel)} / ${intText(agents.length)} 个 Agent 已被黄金比例策略选中` +
    (s.current_agent
      ? ` &middot; 当前 <b>${esc(s.current_agent)}</b> · 第 ${intText(s.current_generation, "?")} 代` +
        ` · 周期 ${intText(s.current_cycle, "?")}`
      : "");

  const byLevel = {};
  agents.forEach((a) => { (byLevel[a.level] = byLevel[a.level] || []).push(a); });

  $("matrix").innerHTML = Object.keys(byLevel).sort().map((lv) => {
    const cells = byLevel[lv].map((a) => {
      const state = !a.selected ? "unselected"
        : ["running", "done", "queued"].includes(a.status) ? a.status : "queued";
      const name = String(a.name == null ? "" : a.name);
      const label = name.replace(/^Agent/, "");
      let m;
      if (!a.selected) m = "本次未选中";
      else if (state === "queued") m = "排队中";
      else m = `第 ${intText(a.generations, "0")} 代 · Qualified ${intText(a.n_qualified, "0")}` +
        ` · Elite ${intText(a.n_elite, "0")}`;
      return `<div class="agent-card ${state}" role="button" tabindex="0"` +
        ` data-agent="${esc(a.name)}" aria-label="${esc(label)}，${stateLabel(state)}">` +
        `<div class="agent-name">${esc(label)}</div>` +
        `<div class="agent-status"><span class="agent-state-dot" aria-hidden="true"></span>` +
        `<span>${stateLabel(state)}</span></div><div class="agent-meta">${m}</div>` +
        `<div class="agent-progress" aria-hidden="true"><span style="width:${agentProgress(a).toFixed(1)}%"></span></div></div>`;
    }).join("");
    return `<div class="level"><div class="level-tag">${esc(LEVELS_ZH[lv] || "层级 " + lv)}</div>
      <div class="level-agents">${cells}</div></div>`;
  }).join("");

  bindAgentCards();
  restoreContainerFocus($("matrix"), focus);
}

function renderFunnel(s) {
  const f = Array.isArray(s.funnel) ? s.funnel : [];
  if (!f.length) {
    $("funnelnote").innerHTML = "";
    $("funnel").innerHTML = '<div class="empty">尚无代次数据</div>';
    return;
  }
  const top = Math.max(1, finiteInt(f[0].survivors) || 0);

  // Say so when the funnel is not the newest generation, rather than letting a stale
  // shape look current.
  const fg = s.funnel_generation || {};
  $("funnelnote").innerHTML = finiteInt(fg.generation) != null
    ? `${esc(fg.agent)} · 第 ${intText(fg.generation)} 代（最近一代无产出）`
    : `${esc((s.latest_generation || {}).agent || "")} · 第 ` +
      `${intText((s.latest_generation || {}).generation, "")} 代`;

  $("funnel").innerHTML = f.map((row) => {
    const survivors = finiteInt(row.survivors) || 0;
    const dropped = finiteInt(row.dropped) || 0;
    const keep = percent((survivors / top) * 100);
    const lost = percent((dropped / top) * 100);
    const cls = row.stage === "elite" ? "funnel-row terminal elite"
      : row.stage === "qualified" ? "funnel-row terminal" : "funnel-row";
    const drop = dropped
      ? ` <span style="color:var(--md-warning)">&minus;${intText(dropped)}</span>` : "";
    return `<div class="${cls}">
      <div class="lbl">${esc(row.stage)}</div>
      <div class="funnel-bar"><div class="keep" style="width:${keep}%"></div>
        <div class="lost" style="width:${lost}%"></div></div>
      <div class="num">${intText(survivors)}${drop}</div></div>`;
  }).join("");
}

function renderTraj(s) {
  const trajectory = Array.isArray(s.elite_trajectory) ? s.elite_trajectory : [];
  const pts = trajectory.map((point) => ({
    score: finiteNumber(point.score),
    n_elite: finiteInt(point.n_elite) || 0,
    boundary: Boolean(point.boundary),
  })).filter((point) => point.score != null);
  const svg = $("traj");
  const primary = themeColor("--md-primary", "currentColor");
  const outline = themeColor("--md-outline", "currentColor");
  const outlineVariant = themeColor("--md-outline-variant", "currentColor");
  const secondary = themeColor("--md-text-secondary", "currentColor");
  if (pts.length < 2) {
    svg.innerHTML = `<text x="14" y="90" fill="${esc(secondary)}" font-size="11">
      ${pts.length ? "目前仅有一个数据点" : "尚无 Elite 得分"}</text>`;
    $("plateau").textContent = "";
    return;
  }
  const W = 560, H = 180, P = 26;
  const xs = (i) => P + (i / (pts.length - 1)) * (W - P * 2);
  const lo = Math.min(...pts.map((p) => p.score));
  const hi = Math.max(...pts.map((p) => p.score));
  const pad = (hi - lo) * 0.15 || 0.05;
  const ys = (v) => H - P - ((v - lo + pad) / (hi - lo + pad * 2)) * (H - P * 2);

  const line = pts.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.score).toFixed(1)}`).join("");
  const area = line + `L${xs(pts.length - 1).toFixed(1)},${H - P}L${xs(0).toFixed(1)},${H - P}Z`;
  // Gridlines: a trading chart is read for level, not just shape, so quartile rules
  // let you place a point without tracing back to the axis.
  const grid = [0.25, 0.5, 0.75].map((f) => {
    const y = (P + f * (H - P * 2)).toFixed(1);
    return `<line x1="${P}" y1="${y}" x2="${W - P}" y2="${y}" ` +
      `stroke="${esc(outlineVariant)}"/>`;
  }).join("");
  // Agent boundaries: each agent restarts at generation 0, so a drop across a
  // boundary is a new search beginning, not the search degrading.
  const bounds = pts.map((p, i) => p.boundary && i
    ? `<line x1="${xs(i).toFixed(1)}" y1="${P - 6}" x2="${xs(i).toFixed(1)}" y2="${H - P}"
        stroke="${esc(outline)}" stroke-dasharray="2 3"/>` : "").join("");
  const dots = pts.map((p, i) =>
    `<rect x="${(xs(i) - 1.8).toFixed(1)}" y="${(ys(p.score) - 1.8).toFixed(1)}"
       width="3.6" height="3.6" fill="${esc(p.n_elite ? primary : outline)}"/>`).join("");

  svg.innerHTML = `
    ${grid}
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="${esc(outline)}"/>
    <line x1="${P}" y1="${P - 6}" x2="${P}" y2="${H - P}" stroke="${esc(outline)}"/>
    ${bounds}
    <path d="${area}" fill="${esc(primary)}" fill-opacity=".08"/>
    <path d="${line}" fill="none" stroke="${esc(primary)}" stroke-width="1.8"/>
    ${dots}
    <text x="3" y="${P + 3}" fill="${esc(secondary)}" font-size="9"
      font-family="ui-monospace,monospace">${hi.toFixed(3)}</text>
    <text x="3" y="${H - P + 3}" fill="${esc(secondary)}" font-size="9"
      font-family="ui-monospace,monospace">${lo.toFixed(3)}</text>`;

  const pl = s.plateau || {};
  $("plateau").innerHTML = !pl.armed
    ? `平台期规则需每个 Agent 至少 ${intText(2 * (finiteInt(pl.window) || 3))} 代；` +
      `当前 ${intText(pl.observations, "0")} 代`
    : `平台期 &delta; = <b>${pl.delta == null ? "&ndash;" : col(pl.delta, 5)}</b>` +
      `，阈值 ${num(pl.delta_limit, 5)}` +
      (pl.would_stop ? ' &mdash; <span style="color:var(--md-warning)">下次检查将停止此 Agent</span>' : "");
}

function renderRoles(s) {
  const rows = Array.isArray(s.calls_by_role) ? s.calls_by_role : [];

// ------------------------------------------------------- compatibility detail layer
function syncScrim() {
  const open = $("drawer").classList.contains("open") || $("agent-panel").classList.contains("open");
  $("scrim").classList.toggle("open", open);
  $("scrim").setAttribute("aria-hidden", "true");
  $("scrim").hidden = !open;
}

function suppressAgentPanelForDrawer() {
  const panel = $("agent-panel");
  if (!panel.classList.contains("open") || panel.inert) return;
  AGENT_PANEL_SUPPRESSED = true;
  panel.inert = true;
  panel.setAttribute("aria-hidden", "true");
  panel.setAttribute("aria-modal", "false");
}

function openDrawer(title, html, status = "") {
  suppressAgentPanelForDrawer();
  $("dtitle").innerHTML = title;
  $("dbody").innerHTML = html;
  $("detail-status").textContent = status;
  $("drawer").hidden = false;
  $("drawer").inert = false;
  $("drawer").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  syncScrim();
  $("dclose").focus();
}
function closeDrawer() {
  cancelDetailRequest();
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("drawer").hidden = true;
  $("drawer").inert = true;
  $("detail-status").textContent = "";
  const panel = $("agent-panel");
  if (AGENT_PANEL_SUPPRESSED && panel.classList.contains("open")) {
    panel.inert = false;
    panel.setAttribute("aria-hidden", "false");
    panel.setAttribute("aria-modal", "true");
  }
  AGENT_PANEL_SUPPRESSED = false;
  syncScrim();
  const trigger = findAction(DETAIL_TRIGGER);
  if (trigger) trigger.focus();
  else if (panel.classList.contains("open")) $("agent-panel-close").focus();
  DETAIL_TRIGGER = null;
}

function openAgentPanel() {
  $("agent-panel").hidden = false;
  $("agent-panel").inert = false;
  $("agent-panel").classList.add("open");
  $("agent-panel").setAttribute("aria-hidden", "false");
  $("agent-panel").setAttribute("aria-modal", "true");
  syncScrim();
  $("agent-panel-close").focus();
}

function closeAgentPanel() {
  const view = AGENT_VIEW;
  cancelAgentRequest();
  if (view && view.refreshTimer != null) clearTimeout(view.refreshTimer);
  $("agent-panel").classList.remove("open");
  $("agent-panel").setAttribute("aria-hidden", "true");
  $("agent-panel").hidden = true;
  $("agent-panel").inert = true;
  syncScrim();
  const cards = $("matrix").querySelectorAll(".agent-card[data-agent]");
  const trigger = Array.from(cards).find((card) =>
    view && card.dataset.agent === view.name);
  if (trigger) trigger.focus();
  AGENT_VIEW = null;
}

function beginAgentRequest(view, targetRevision) {
  if (AGENT_ABORT) AGENT_ABORT.abort();
  AGENT_ABORT = new AbortController();
  AGENT_REQUEST_VERSION += 1;
  return {version:AGENT_REQUEST_VERSION, controller:AGENT_ABORT, view, targetRevision};
}

function cancelAgentRequest() {
  AGENT_REQUEST_VERSION += 1;
  if (AGENT_ABORT) AGENT_ABORT.abort();
  AGENT_ABORT = null;
}

function agentRequestIsCurrent(request, name) {
  return request.version === AGENT_REQUEST_VERSION &&
    request.controller === AGENT_ABORT && !request.controller.signal.aborted &&
    request.view === AGENT_VIEW && AGENT_VIEW && AGENT_VIEW.name === name &&
    $("agent-panel").classList.contains("open");
}

function beginDetailRequest() {
  if (DETAIL_ABORT) DETAIL_ABORT.abort();
  DETAIL_ABORT = new AbortController();
  DETAIL_REQUEST_VERSION += 1;
  return {version:DETAIL_REQUEST_VERSION, controller:DETAIL_ABORT};
}

function cancelDetailRequest() {
  DETAIL_REQUEST_VERSION += 1;
  if (DETAIL_ABORT) DETAIL_ABORT.abort();
  DETAIL_ABORT = null;
}

function detailIsCurrent(request) {
  return request.version === DETAIL_REQUEST_VERSION &&
    request.controller === DETAIL_ABORT && !request.controller.signal.aborted &&
    $("drawer").classList.contains("open");
}

function detailError(error) {
  if (error && error.name === "AbortError") return "";
  return esc(error && error.message ? error.message : error || "详情加载失败");
}

function isTabbableInDialog(element, dialog) {
  if (!element || element.disabled || element.tabIndex < 0) return false;
  if (typeof element.getClientRects === "function" && !element.getClientRects().length) return false;
  for (let current = element; current; current = current.parentElement) {
    if (current.hidden || current.inert || current.disabled) return false;
    if (typeof current.getAttribute === "function" && current.getAttribute("aria-hidden") === "true") {
      return false;
    }
    if (typeof getComputedStyle === "function") {
      const style = getComputedStyle(current);
      if (style.display === "none" || style.visibility === "hidden" || style.visibility === "collapse") {
        return false;
      }
    }
    if (current === dialog) break;
  }
  return true;
}

function trapDialogFocus(event, dialog) {
  if (event.key !== "Tab") return;
  const focusable = Array.from(dialog.querySelectorAll(
    'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),' +
    'textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )).filter((element) => isTabbableInDialog(element, dialog));
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (!dialog.contains(document.activeElement) ||
      (!event.shiftKey && document.activeElement === last) ||
      (event.shiftKey && document.activeElement === first)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus();
  }
}

function switchAgentTab(tabName, focus = false) {
  if (!AGENT_TABS.includes(tabName)) return;
  if (AGENT_VIEW) AGENT_VIEW.tab = tabName;
  renderAgentDetail();
  const tabs = Array.from($("agent-tabs").querySelectorAll("[data-tab]"));
  tabs.forEach((tab) => {
    const selected = tab.dataset.tab === tabName;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
    if (selected && focus) tab.focus();
  });
  AGENT_TABS.forEach((name) => {
    const panel = $(`agent-tabpanel-${name}`);
    if (panel) panel.hidden = name !== tabName;
  });
  $("agent-panel-body").dataset.tab = tabName;
}

$("dclose").onclick = closeDrawer;
$("agent-panel-close").onclick = closeAgentPanel;
$("scrim").onclick = () => {
  if ($("drawer").classList.contains("open")) closeDrawer();
  else closeAgentPanel();
};
$("agent-tabs").querySelectorAll("[data-tab]").forEach((tab) => {
  tab.onclick = () => switchAgentTab(tab.dataset.tab);
  tab.onkeydown = (event) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    const tabs = Array.from($("agent-tabs").querySelectorAll("[data-tab]"));
    const offset = event.key === "ArrowRight" ? 1 : -1;
    const index = (tabs.indexOf(tab) + offset + tabs.length) % tabs.length;
    switchAgentTab(tabs[index].dataset.tab, true);
  };
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if ($("drawer").classList.contains("open")) closeDrawer();
    else if ($("agent-panel").classList.contains("open")) closeAgentPanel();
    return;
  }
  if ($("drawer").classList.contains("open")) trapDialogFocus(event, $("drawer"));
  else if ($("agent-panel").classList.contains("open")) trapDialogFocus(event, $("agent-panel"));
});

async function showCall(seq) {
  const normalizedSeq = finiteInt(seq);
  const title = `调用 #${intText(normalizedSeq, "?")}`;
  const request = beginDetailRequest();
  openDrawer(title, '<div class="empty">加载中&hellip;</div>', "详情加载中");
  if (normalizedSeq == null) {
    if (detailIsCurrent(request)) openDrawer(title, '<div class="warn-box">无效调用编号</div>');
    return;
  }
  try {
    const r = await fetch(`/api/call/${encodeURIComponent(normalizedSeq)}`, {
      signal:request.controller.signal
    });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    if (!detailIsCurrent(request)) return;
    const tags = d.tags || {}, u = d.usage || {};
    openDrawer(`${title} &middot; ${esc(tags.role || "")}`, `
      <dl class="kv">
        ${Object.entries(tags).map(([k, v]) =>
          `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? v.join(", ") : v)}</dd>`).join("")}
        <dt>model</dt><dd>${esc(d.model)}</dd>
        <dt>temperature</dt><dd>${num(d.temperature, 2)}</dd>
        <dt>tokens</dt><dd>${intText(u.prompt_tokens, "?")} in / ${intText(u.completion_tokens, "?")} out</dd>
        <dt>latency</dt><dd>${num(d.latency_ms, 0)} ms</dd>
      </dl>
      <h2>system</h2><pre>${esc(d.system || "(none)")}</pre>
      <h2>prompt</h2><pre>${esc(d.prompt)}</pre>
      <h2>response</h2><pre>${esc(d.response)}</pre>`);
  } catch (e) {
    if (!detailIsCurrent(request) || (e && e.name === "AbortError")) return;
    openDrawer(title, `<div class="warn-box">${detailError(e)}</div>`);
  }
}

function miniTrajectory(points) {
  const values = (Array.isArray(points) ? points : []).map((point) => ({
    score: finiteNumber(point && point.score),
    generation: finiteInt(point && point.generation),
  })).filter((point) => point.score != null);
  const primary = themeColor("--md-primary", "currentColor");
  const outline = themeColor("--md-outline-variant", "currentColor");
  const secondary = themeColor("--md-text-secondary", "currentColor");
  const open = `<svg class="agent-mini-trajectory" viewBox="0 0 520 150" role="img"` +
    ` aria-label="Agent Elite 平均得分轨迹">`;
  if (!values.length) {
    return `${open}<text x="18" y="78" fill="${esc(secondary)}" font-size="12">` +
      `尚无得分轨迹</text></svg>`;
  }
  if (values.length === 1) {
    return `${open}<line x1="18" y1="75" x2="502" y2="75" stroke="${esc(outline)}"/>` +
      `<circle cx="260" cy="75" r="4" fill="${esc(primary)}"/>` +
      `<text x="270" y="70" fill="${esc(secondary)}" font-size="11">` +
      `${esc(values[0].score.toFixed(4))}</text></svg>`;
  }
  const W = 520, H = 150, P = 18;
  const magnitude = values.reduce((largest, point) =>
    Math.max(largest, Math.abs(point.score)), 0) || 1;
  const scaled = values.map((point) => point.score / magnitude);
  const lo = Math.min(...scaled);
  const hi = Math.max(...scaled);
  const pad = (hi - lo) * 0.12 || 0.05;
  const x = (index) => P + (index / (values.length - 1)) * (W - 2 * P);
  const y = (score) => H - P - ((score - lo + pad) / (hi - lo + 2 * pad)) * (H - 2 * P);
  const line = values.map((point, index) =>
    `${x(index).toFixed(1)},${y(scaled[index]).toFixed(1)}`).join(" ");
  const dots = values.map((point, index) =>
    `<circle cx="${x(index).toFixed(1)}" cy="${y(scaled[index]).toFixed(1)}" r="3"` +
      ` fill="${esc(primary)}"/>`).join("");
  return `${open}<line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}"` +
    ` stroke="${esc(outline)}"/><polyline points="${line}" fill="none"` +
    ` stroke="${esc(primary)}" stroke-width="2"/>${dots}</svg>`;
}

function agentRevision(snapshot, name) {
  const agents = snapshot && Array.isArray(snapshot.agents) ? snapshot.agents : [];
  const agent = agents.find((item) => item && item.name === name);
  if (!agent) return "missing";
  const status = ["running", "done", "queued"].includes(agent.status)
    ? agent.status : "queued";
  return [status, agent.generations, agent.llm_calls, agent.n_generated,
    agent.n_qualified, agent.n_elite].map((value, index) =>
      index ? (finiteInt(value) || 0) : value).join("|");
}

function scheduleAgentRefresh() {
  const view = AGENT_VIEW;
  if (!view || !view.name || !$("agent-panel").classList.contains("open")) return;
  const revision = agentRevision(LAST, view.name);
  if (revision === view.revision) {
    if (view.refreshTimer != null) clearTimeout(view.refreshTimer);
    view.refreshTimer = null;
    return;
  }
  if (view.loading || view.refreshTimer != null) return;
  const elapsed = Math.max(0, Date.now() - (finiteNumber(view.lastLoadedAt) || 0));
  const delay = Math.max(0, AGENT_REFRESH_MIN_MS - elapsed);
  view.refreshTimer = setTimeout(() => {
    if (AGENT_VIEW !== view || !$("agent-panel").classList.contains("open")) return;
    view.refreshTimer = null;
    if (view.loading || agentRevision(LAST, view.name) === view.revision) return;
    return loadAgentDetail(view.name, {refresh:true});
  }, delay);
}

function renderAgentError(view) {
  return `<section class="agent-error" role="alert"><b>Agent 详情加载失败</b>
    <p>${esc(view && view.error || "请稍后重试")}</p>
    <button type="button" data-action="retry-agent" data-agent="${esc(view && view.name)}">重试</button>
  </section>`;
}

function renderAgentDetail() {
  const view = AGENT_VIEW;
  if (!view) return;
  const body = $("agent-panel-body");
  const focus = captureContainerFocus(body);
  const initialLoading = view.loading && !view.detail;
  const error = view.error ? renderAgentError(view) : "";
  if (initialLoading) {
    AGENT_TABS.forEach((name) => {
      $(`agent-tabpanel-${name}`).innerHTML = renderAgentLoading();
    });
    body.setAttribute("aria-busy", "true");
  } else if (!view.detail) {
    AGENT_TABS.forEach((name) => { $(`agent-tabpanel-${name}`).innerHTML = error; });
    body.removeAttribute("aria-busy");
  } else {
    $("agent-tabpanel-overview").innerHTML = error + renderAgentOverview(view.detail);
    $("agent-tabpanel-activity").innerHTML = error + renderAgentActivity(view.detail);
    $("agent-tabpanel-generations").innerHTML = error + renderAgentGenerations(view.detail);
    body.removeAttribute("aria-busy");
  }
  AGENT_TABS.forEach((name) => {
    $(`agent-tabpanel-${name}`).hidden = name !== view.tab;
  });
  body.dataset.tab = view.tab;
  restoreContainerFocus(body, focus);
}

function focusSelectedAgentTab() {
  const view = AGENT_VIEW;
  if (!view) return;
  const tab = Array.from($("agent-tabs").querySelectorAll("[data-tab]"))
    .find((candidate) => candidate.dataset.tab === view.tab);
  if (tab) tab.focus();
}

async function loadAgentDetail(name, options = {}) {
  const safeName = String(name == null ? "" : name);
  const view = AGENT_VIEW;
  if (!safeName || !view || view.name !== safeName ||
      !$("agent-panel").classList.contains("open")) return;
  view.loading = true;
  view.error = null;
  if (!options.refresh) renderAgentDetail();
  const request = beginAgentRequest(view, agentRevision(LAST, safeName));
  try {
    const response = await fetch(`/api/agent/${encodeURIComponent(safeName)}`, {
      signal:request.controller.signal
    });
    if (!response.ok) throw new Error(await response.text() || "Agent 详情不可用");
    const detail = await response.json();
    if (!agentRequestIsCurrent(request, safeName)) return;
    if (!detail || typeof detail !== "object") throw new Error("Agent 详情格式无效");
    view.detail = detail;
    view.loading = false;
    view.error = null;
    view.lastLoadedAt = Date.now();
    view.revision = request.targetRevision;
    AGENT_ABORT = null;
    renderAgentHeader(detail);
    renderAgentDetail();
    if (options.retryFocus) focusSelectedAgentTab();
    scheduleAgentRefresh();
  } catch (error) {
    if (!agentRequestIsCurrent(request, safeName) ||
        (error && error.name === "AbortError")) return;
    AGENT_ABORT = null;
    view.loading = false;
    view.lastLoadedAt = Date.now();
    view.error = error && error.message ? error.message : "请稍后重试";
    renderAgentDetail();
    if (options.retryFocus) {
      const activePanel = $(`agent-tabpanel-${view.tab}`);
      const retry = activePanel && Array.from(activePanel.querySelectorAll("[data-action]"))
        .find((element) => {
          const identity = actionIdentity(element);
          return identity && identity.action === "retry-agent" && identity.key === safeName;
        });
      if (retry) retry.focus();
    }
  }
}

function showAgent(name, trigger) {
  if (!LAST) return;
  const safeName = String(name == null ? "" : name);
  const agents = Array.isArray(LAST.agents) ? LAST.agents : [];
  const agent = agents.find((item) => item && item.name === safeName);
  if (!agent) return;
  cancelAgentRequest();
  if (AGENT_VIEW && AGENT_VIEW.refreshTimer != null) {
    clearTimeout(AGENT_VIEW.refreshTimer);
  }
  const isCurrent = LAST.current_agent === safeName;
  AGENT_VIEW = {
    name:safeName,
    tab:"overview",
    detail:null,
    loading:true,
    error:null,
    lastLoadedAt:0,
    revision:agentRevision(LAST, safeName),
    refreshTimer:null,
    trigger:controlIdentity(trigger) || {type:"agent", key:safeName},
  };
  renderAgentHeader({
    ...agent,
    name:safeName,
    display_name:safeName.replace(/^Agent/, ""),
    current_generation:isCurrent ? LAST.current_generation : null,
    current_cycle:isCurrent ? LAST.current_cycle : null,
  });
  renderAgentDetail();
  switchAgentTab("overview");
  openAgentPanel();
  return loadAgentDetail(safeName);
}

async function showGeneration(agent, gen) {
  const normalizedGeneration = finiteInt(gen);
  const safeAgent = String(agent == null ? "" : agent);
  const title = `${esc(safeAgent)} &middot; 第 ${intText(normalizedGeneration, "?")} 代`;
  const request = beginDetailRequest();
  openDrawer(title, '<div class="empty">加载中&hellip;</div>', "详情加载中");
  if (!safeAgent || normalizedGeneration == null) {
    if (detailIsCurrent(request)) openDrawer(title, '<div class="warn-box">无效代次请求</div>');
    return;
  }
  try {
    const r = await fetch(`/api/generation/${encodeURIComponent(safeAgent)}/${encodeURIComponent(normalizedGeneration)}`, {
      signal:request.controller.signal
    });
    if (!r.ok) throw new Error(await r.text());
    const payload = await r.json();
    if (!detailIsCurrent(request)) return;
    const rows = Array.isArray(payload) ? payload : [];
    openDrawer(title, rows.length ? `
    <table><thead><tr><th>name</th><th>tier</th><th>op</th>
      <th class="num">RankIC</th><th>note</th></tr></thead><tbody>
      ${rows.map((x) => `<tr class="click" role="button" tabindex="0" data-action="alpha" data-alpha="${esc(x.alpha_id)}">
        <td class="mono">${esc(x.name)}</td>
        <td class="${tierCls(x.tier)}">${esc(x.tier)}</td>
        <td class="sub">${esc(x.op || "")}</td>
        <td class="num">${col((x.fitness || {}).rank_ic)}</td>
        <td class="sub">${esc((x.rejected_at ? x.rejected_at + ": " : "") +
          (x.reject_reason || "").slice(0, 90))}</td></tr>`).join("")}
    </tbody></table>`
    : `<div class="empty">该代暂无已保存的 Alpha 记录。运行保存 alphas.jsonl 后可查看逐项详情。</div>`);
  } catch (e) {
    if (!detailIsCurrent(request) || (e && e.name === "AbortError")) return;
    openDrawer(title, `<div class="warn-box">${detailError(e)}</div>`);
  }
}

async function showAlpha(id) {
  const safeId = String(id == null ? "" : id);
  const request = beginDetailRequest();
  openDrawer(esc(safeId), '<div class="empty">加载中&hellip;</div>', "详情加载中");
  if (!safeId) {
    if (detailIsCurrent(request)) openDrawer("Alpha", '<div class="warn-box">无效 Alpha 标识</div>');
    return;
  }
  try {
    const r = await fetch(`/api/alpha/${encodeURIComponent(safeId)}`, {signal:request.controller.signal});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    if (!detailIsCurrent(request)) return;
    const f = d.fitness || {}, l = d.lineage || {};
    const nanRatio = finiteNumber(f.nan_ratio);
    const parents = Array.isArray(l.parents) ? l.parents : [];
    const checks = Array.isArray(d.checks) ? d.checks : [];
    openDrawer(esc(d.name), `
    <dl class="kv">
      <dt>tier</dt><dd class="${tierCls(d.tier)}">${esc(d.tier)}</dd>
      <dt>IC / RankIC</dt><dd>${col(f.ic)} / ${col(f.rank_ic)}</dd>
      <dt>ICIR / RankICIR</dt><dd>${col(f.icir, 3)} / ${col(f.rank_icir, 3)}</dd>
      <dt>MI</dt><dd>${num(f.mi)}</dd>
      <dt>days / nan</dt><dd>${intText(f.n_days, "?")} / ${nanRatio == null ? "?" : num(nanRatio * 100, 1) + "%"}</dd>
      <dt>origin</dt><dd>${esc(l.op)} by ${esc(l.agent)} (level ${intText(l.level, "?")}, ${esc(l.guidance_mode || "?")})</dd>
      <dt>generation</dt><dd>${intText(l.generation, "?")} cycle ${intText(l.cycle, "?")}</dd>
      ${parents.length ? `<dt>parents</dt><dd>${esc(parents.join(", "))}</dd>` : ""}
      ${l.repair_rounds || l.improve_rounds
        ? `<dt>revisions</dt><dd>${intText(l.repair_rounds, "0")} repair, ${intText(l.improve_rounds, "0")} improve</dd>` : ""}
    </dl>
    ${d.rejected_at ? `<div class="warn-box">rejected at ${esc(d.rejected_at)}:
      ${esc(d.reject_reason)}</div>` : ""}
    <h2>checks</h2>
    ${checks.map((c) => `<div class="chk ${c.passed ? "ok" : "no"}">
      <span class="${c.passed ? "p" : "f"}">${c.passed ? "✓" : "✗"}</span>
      <b>${esc(c.stage)}</b> &mdash; ${esc(c.detail || "")}</div>`).join("")
      || '<div class="empty">none recorded</div>'}
    <h2 style="margin-top:14px">code</h2><pre>${esc(d.code)}</pre>`);
  } catch (e) {
    if (!detailIsCurrent(request) || (e && e.name === "AbortError")) return;
    openDrawer(esc(safeId), `<div class="warn-box">${detailError(e)}</div>`);
  }
}

async function showCandidate(file) {
  const safeFile = String(file == null ? "" : file);
  const request = beginDetailRequest();
  openDrawer(esc(safeFile), '<div class="empty">加载中&hellip;</div>', "详情加载中");
  if (!safeFile) {
    if (detailIsCurrent(request)) openDrawer("候选因子", '<div class="warn-box">无效文件名</div>');
    return;
  }
  try {
    const r = await fetch(`/api/candidate/${encodeURIComponent(safeFile)}`, {
      signal:request.controller.signal
    });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    if (!detailIsCurrent(request)) return;
    openDrawer(esc(safeFile), `<pre>${esc(d.code)}</pre>`);
  } catch (e) {
    if (!detailIsCurrent(request) || (e && e.name === "AbortError")) return;
    openDrawer(esc(safeFile), `<div class="warn-box">${detailError(e)}</div>`);
  }
}

// ------------------------------------------------------------------- transport
// SSE with a polling fallback: an SSH tunnel or a proxy that buffers can break the
// event stream, and a dashboard that silently freezes is worse than a slow one.
function setTransportStatus(text) {
  $("status").className = "status-chip stale";
  $("status").innerHTML = `<span class="dot"></span>${esc(text)}`;
}

function clearSSEWatchdog() {
  if (SSE_WATCHDOG != null) clearTimeout(SSE_WATCHDOG);
  SSE_WATCHDOG = null;
}

function isActiveEventSource(source, version) {
  return !POLLING && ACTIVE_EVENT_SOURCE === source && SSE_SOURCE_VERSION === version;
}

function shouldAcceptPolledState(sourceVersion) {
  return sourceVersion == null || POLLING ||
    (sourceVersion === SSE_SOURCE_VERSION && ACTIVE_EVENT_SOURCE != null && !SSE_HAS_MESSAGE);
}

function fallbackToPolling(source, version) {
  if (!isActiveEventSource(source, version)) return;
  clearSSEWatchdog();
  source.close();
  ACTIVE_EVENT_SOURCE = null;
  startPolling();
}

function connect() {
  if (POLLING) return;
  const version = ++SSE_SOURCE_VERSION;
  let source;
  try {
    source = new EventSource("/api/stream");
    ACTIVE_EVENT_SOURCE = source;
    SSE_HAS_MESSAGE = false;
    clearSSEWatchdog();
    SSE_WATCHDOG = setTimeout(
      () => fallbackToPolling(source, version), SSE_FIRST_MESSAGE_TIMEOUT_MS
    );
    source.onopen = () => {
      if (!isActiveEventSource(source, version)) return;
      if (!LAST) setTransportStatus("等待事件");
    };
    source.onmessage = (event) => {
      if (!isActiveEventSource(source, version)) return;
      try {
        const state = JSON.parse(event.data);
        SSE_HAS_MESSAGE = true;
        clearSSEWatchdog();
        render(state);
      }
      catch (_) { setTransportStatus("事件解析失败，正在重连"); }
    };
    source.onerror = () => {
      if (!isActiveEventSource(source, version)) return;
      setTransportStatus("连接中断，正在重连");
      if (!SSE_HAS_MESSAGE) fallbackToPolling(source, version);
      // After a valid message, keep the EventSource alive so native retry preserves ordering.
    };
  } catch (_) {
    startPolling();
    return;
  }
  // Cold start: paint immediately instead of waiting for the first tick.
  poll(version);
}

function startPolling() {
  if (POLLING) return;
  POLLING = true;
  clearSSEWatchdog();
  if (ACTIVE_EVENT_SOURCE) {
    ACTIVE_EVENT_SOURCE.close();
    ACTIVE_EVENT_SOURCE = null;
  }
  poll();
}

async function poll(sourceVersion = null) {
  if (POLL_IN_FLIGHT) return;
  POLL_IN_FLIGHT = true;
  try {
    const response = await fetch("/api/state");
    if (!response.ok) throw new Error("state unavailable");
    const state = await response.json();
    if (shouldAcceptPolledState(sourceVersion)) render(state);
  } catch (_) {
    if (shouldAcceptPolledState(sourceVersion)) setTransportStatus("连接中断，正在重连");
  } finally {
    POLL_IN_FLIGHT = false;
    if (POLLING) {
      clearTimeout(POLL_TIMER);
      POLL_TIMER = setTimeout(poll, 2000);
    }
  }
}
connect();
