[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "cogalpha"
version = "0.1.0"
description = "CogAlpha: cognitive alpha mining via LLM-driven code-based evolution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "tenacity>=8.0"]
model = ["scikit-learn>=1.3", "lightgbm>=4.0"]
qlib = ["pyqlib>=0.9"]
monitor = ["fastapi>=0.100", "uvicorn>=0.23"]
ta = ["TA-Lib>=0.4"]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
cogalpha = "cogalpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cogalpha"]
